<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Squishy Escape</title>
<style>
  :root{
    --pink:#ffd6e8; --mint:#d8f5e6; --lav:#e4dbff; --lemon:#fff2c4; --sky:#d9ecff;
    --ink:#5a4a66; --ink-soft:#8a7a96; --card:#fffdf9;
    --shadow:0 6px 0 rgba(90,74,102,.18), 0 12px 30px rgba(90,74,102,.16);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overscroll-behavior:none}
  body{
    background:
      radial-gradient(1200px 600px at 20% -10%, #fff 0%, transparent 60%),
      linear-gradient(160deg,var(--sky),var(--lav) 45%,var(--pink));
    font-family:ui-rounded,"SF Pro Rounded",Nunito,"Segoe UI Variable",system-ui,sans-serif;
    color:var(--ink);
    display:grid; place-items:center;
    overflow:hidden;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    touch-action:none;
  }
  #stage{
    position:relative;
    touch-action:none;
    width:min(100vw, calc(100vh * 16 / 9));
    aspect-ratio:16/9;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(90,74,102,.35);
    background:#e9f4ff;
  }
  canvas{display:block;width:100%;height:100%}

  .layer{position:absolute;inset:0;pointer-events:none}
  .layer > *{pointer-events:auto}

  /* ---------- in-run HUD ---------- */
  #hud{display:none;padding:2.2% 2.6%;font-weight:800}
  #hud.on{display:block}
  .hudrow{display:flex;align-items:center;gap:1.2em;justify-content:space-between;
    padding-right:clamp(56px,9vmin,104px)}
  .pill{
    background:rgba(255,253,249,.86); border-radius:999px;
    padding:.35em .85em; font-size:clamp(10px,1.9vmin,20px);
    box-shadow:0 3px 0 rgba(90,74,102,.12);
    display:flex;align-items:center;gap:.45em; white-space:nowrap;
  }
  #hearts{letter-spacing:.08em;font-size:clamp(12px,2.4vmin,26px)}

  /* ---------- menus ---------- */
  #menu{display:grid;place-items:center;background:rgba(255,247,252,.55);backdrop-filter:blur(3px)}
  #menu.off{display:none}
  .sheet{
    width:min(86%,720px); max-height:88%; overflow:auto;
    background:var(--card); border-radius:22px; padding:clamp(14px,2.6vmin,28px);
    box-shadow:var(--shadow); text-align:center;
  }
  .sheet::-webkit-scrollbar{width:8px}
  .sheet::-webkit-scrollbar-thumb{background:var(--lav);border-radius:99px}
  h1{
    margin:.1em 0 .05em; font-size:clamp(22px,5.4vmin,54px); letter-spacing:-.02em;
    background:linear-gradient(90deg,#ff9fc4,#ffca7a,#8fe0c0,#8fb8f0,#c9a0f0);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  h2{margin:.1em 0 .5em;font-size:clamp(16px,3.2vmin,30px)}
  p.sub{margin:.2em 0 1em;color:var(--ink-soft);font-size:clamp(11px,2vmin,17px);font-weight:600}
  .ver{display:inline-block;margin-left:.35em;padding:.12em .5em;border-radius:99px;
    background:var(--lav);color:var(--ink);font-size:.82em;font-weight:800;letter-spacing:.01em}
  .stats{display:flex;gap:.5em;justify-content:center;flex-wrap:wrap;margin:.6em 0 1em}
  .stat{background:var(--mint);border-radius:14px;padding:.5em .8em;font-weight:800;font-size:clamp(11px,2vmin,17px)}
  .stat b{display:block;font-size:clamp(14px,2.8vmin,24px)}
  .stat.money{background:var(--lemon)} .stat.egg{background:var(--lav)} .stat.book{background:var(--pink)}
  .btns{display:flex;flex-wrap:wrap;gap:.6em;justify-content:center}
  button{
    font:inherit;font-weight:900;cursor:pointer;border:0;color:var(--ink);
    background:var(--lav); border-radius:16px;
    padding:.62em 1.15em; font-size:clamp(12px,2.2vmin,19px);
    box-shadow:0 4px 0 rgba(90,74,102,.2); transition:transform .06s, box-shadow .06s, filter .12s;
  }
  button:hover{filter:brightness(1.04)}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(90,74,102,.2)}
  button.primary{background:linear-gradient(120deg,#ffd0e4,#ffe6b8);font-size:clamp(14px,2.8vmin,24px);padding:.7em 1.6em}
  button:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
  button.small{padding:.42em .8em;font-size:clamp(10px,1.8vmin,15px);border-radius:12px;background:var(--mint)}
  .cost{font-weight:700;opacity:.75;font-size:.85em}

  /* ---------- collection grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:.5em;margin:.4em 0 .8em}
  .cell{
    background:#f6f2fb;border-radius:14px;padding:.45em .2em .5em;position:relative;
    display:flex;flex-direction:column;align-items:center;gap:.15em;
  }
  .cell.have{background:#fff}
  .cell.equipped{outline:3px solid #ffb0d0}
  .cell canvas{width:54px;height:54px}
  .cell .nm{font-size:10px;font-weight:800;line-height:1.15}
  .cell .rr{font-size:9px;font-weight:800;opacity:.8}
  .cell .ct{position:absolute;top:3px;right:6px;font-size:10px;font-weight:900;opacity:.6}
  .cell .pw{font-size:9px;font-weight:800;color:#c0299c;margin-top:-.1em}
  .cell.locked .nm{opacity:.35}

  /* ---------- multiplayer forms ---------- */
  .mpForm{display:flex;flex-direction:column;gap:.6em;margin:1em auto;max-width:320px}
  .mpForm input{
    font:inherit;font-weight:800;color:var(--ink);text-align:center;
    background:#f6f2fb;border:2px solid var(--lav);border-radius:14px;
    padding:.6em 1em;font-size:clamp(13px,2.4vmin,20px);
  }
  .mpForm input:focus{outline:none;border-color:#ffb0d0}
  .tradeRow{display:flex;align-items:center;justify-content:space-between;gap:.6em;background:#f6f2fb;border-radius:14px;padding:.5em .7em;margin-bottom:.4em;font-weight:800;font-size:clamp(10px,1.9vmin,16px);text-align:left}
  .odds{display:flex;gap:.35em;justify-content:center;flex-wrap:wrap;margin:.3em 0 .7em}
  .odds span{background:#f4f0fa;border-radius:10px;padding:.3em .55em;font-size:clamp(9px,1.7vmin,14px);font-weight:800}

  /* ---------- touch controls ---------- */
  #touch{display:none;position:absolute;inset:auto 0 0 0;justify-content:space-between;
    padding:0 2.5% calc(2.4% + env(safe-area-inset-bottom,0px))}
  body.touch #touch.on{display:flex}
  .tbtn{
    width:17vmin;height:17vmin;max-width:112px;max-height:112px;border-radius:50%;
    touch-action:none;
    background:rgba(255,253,249,.62);box-shadow:0 4px 0 rgba(90,74,102,.18);
    display:grid;place-items:center;font-size:5vmin;font-weight:900;color:var(--ink);
  }
  .tbtn:active{background:rgba(255,253,249,.9)}
  #tcMove{display:flex;gap:1.6vmin}
  #corner{position:absolute;inset:0 0 auto auto;padding:1.4% 1.6%;display:flex;gap:.4em;align-items:flex-start}
  #corner button{padding:.35em .6em;font-size:clamp(10px,1.7vmin,15px);background:rgba(255,253,249,.8);border-radius:12px}
  #btnPause{display:none} body.playing #btnPause{display:block}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div class="layer" id="hud">
    <div class="hudrow">
      <div class="pill"><span id="hearts">💗💗💗</span></div>
      <div class="pill" id="powerPill" style="display:none">
        <span id="powerIcon"></span> <span id="powerLabel"></span></div>
      <div class="pill">🪙 <span id="hudMoney">0</span> <span style="opacity:.55">Dumpleningness</span></div>
      <div class="pill">📏 <span id="hudDist">0</span> m</div>
    </div>
  </div>

  <div class="layer" id="touch">
    <div id="tcMove">
      <div class="tbtn" id="tcLeft">◀</div>
      <div class="tbtn" id="tcRight">▶</div>
    </div>
    <div class="tbtn" id="tcJump">⤴</div>
  </div>

  <div class="layer" id="corner">
    <button id="btnPause" title="Pause">❚❚</button>
    <button id="btnMute" title="Sound">🔊</button>
  </div>

  <div class="layer" id="menu"><div class="sheet" id="sheet"></div></div>
</div>
<!-- Optional: only needed for "Trade Online" -- the game runs fully
     offline/single-player without either of these loading. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="multiplayer.js"></script>
<script>
/* =====================================================================
   SQUISHY ESCAPE
   by Annie Smith & Ash Smith
   ---------------------------------------------------------------------
   A 2D side-scroller. Run right, jump obstacles, stomp the 6-7s, outrun
   the squish wall, spend Dumpleningness on better eggs, hatch rarer
   squishies, trade duplicates up with the Squishy Trader.
   ===================================================================== */
(() => {
"use strict";

/* ------------------------------ constants ------------------------------ */
const VERSION = "1.8.1";           // major.minor.patch -- bump minor for features

const W = 960, H = 540;            // virtual resolution
const TILE = 45;                   // tile size
const ROWS = 12;                   // rows per chunk (12 * 45 = 540)
const COLS = 16;                   // columns per chunk
const CHUNK_W = COLS * TILE;       // 720px of course per chunk

const GRAVITY      = 2200;
const JUMP_V       = 780;
const JUMP_CUT     = 0.45;   // release jump early -> shorter hop
const RUN_ACCEL    = 1600;   // build up to speed rather than snapping to it
const AIR_ACCEL    = 1100;
const FRICTION     = 2200;
const MAX_RUN      = 335;
const SPRINT_RUN   = 405;    // keep running and you gradually wind up to this
const SPRINT_AFTER = 0.85;   // seconds of holding a direction before it kicks in
const SPRINT_RAMP  = 1.1;    // and how long the wind-up itself takes
const MAX_FALL     = 1050;
const COYOTE       = 0.10;   // grace period after walking off a ledge
const DOUBLE_V     = 0.86;   // the mid-air bounce, as a fraction of a full jump
const JUMP_BUFFER  = 0.12;   // press jump slightly early and it still fires
const STOMP_BOUNCE = 625;
const IFRAMES      = 1.4;
const MAX_HEARTS   = 5;
const STAR_TIME    = 11.05; // Super-Mario-style invincibility (8.5s + 30%)

const WALL_BASE  = 85;    // squish wall speed at the start (px/s)
const WALL_GAIN  = 0.066; // ...plus this much per metre travelled
const WALL_MAX   = 305;
const WALL_LEASH = 950;   // if you get further ahead than this, it speeds up

/* the magical carrot and the rainbow ride it launches you into */
const RAINBOW_TIME  = 9.5;   // seconds in the sky
const RAINBOW_SPEED = 430;   // how fast you fly along the rainbow
const RAINBOW_LIFT  = 2050;  // hold jump to climb
const RAINBOW_FALL  = 1150;
const RAINBOW_VMAX  = 460;
const CARROT_COIN   = 3;     // sky coins are worth more than ground ones

/* superpowers -- only the Mythic squishies carry one, and only the equipped
   one is active. Multipliers are deliberately noticeable but not game-breaking. */
const POWER_SPEED_MULT = 1.3;
const POWER_JUMP_MULT  = 1.32;
const POWER_BIG_SCALE  = 1.32;
const POWER_BIG_STEP   = 1.6;   // step-up lip height multiplier while big
const FLY_TIME  = 10;
const FLY_LIFT  = 3400;   // must clearly beat GRAVITY (2200) or the player never climbs
const FLY_VMAX  = 260;

/* sliding down a slope */
const SLIDE_ACCEL = 1500;
const SLIDE_MAX   = 540;
/* How high a lip the dumpling will just walk over instead of bumping into.
   A 45-degree ramp puts the front of the body up to half a body-width higher
   than its middle, so without this you wedge against the next column of a
   hill and stop dead. */
const STEP_UP     = 24;
/* brick blocks you can smash open from underneath */
const BRICK_HITS  = 3;
/* the trampoline -- a much bigger version of a normal jump, not a separate
   mode. You launch up near the clouds and land wherever gravity takes you,
   still inside the ordinary run the whole time. */
const TRAMPOLINE_BOUNCE = 1750;
const TRAMPOLINE_MUSIC  = 2.7;  // roughly how long the peaceful duck lasts
const TRAMPOLINE_COINS  = 9;    // spawned fresh on each bounce, cleared after
/* Full flight time at TRAMPOLINE_BOUNCE=1750, gravity=2200 is ~1.59s (apex at
   0.795s, symmetric fall back to launch height). The re-trigger cooldown MUST
   outlast that, or the player passes back through the trampoline's own
   hitbox while still falling fast on the way down, re-triggers it, and never
   actually lands -- an infinite bounce loop. Keep a healthy margin since
   horizontal drift and JUMP_CUT exemption timing both nudge the real flight
   time around a little. */
const TRAMPOLINE_COOLDOWN = 2.4;
/* The play camera never scrolls vertically in normal course sections -- rows
   0-11 always fit the 540px screen. A trampoline bounce needs to send you
   high enough that the ground genuinely leaves view, so the camera eases
   upward whenever the player is above CAM_Y_LINE and settles back to 0 the
   moment they're not (an ordinary jump barely grazes this, so normal play is
   unaffected). One CAM_Y_LINE constant, one lerp, no per-scene special case. */
const CAM_Y_LINE = 250;
/* wooden platforms that give way */
const WOOD_SHAKE  = 0.5;   // warning wobble before it drops
const WOOD_BACK   = 3.2;   // and how long until it rebuilds itself

/* ------------------------------- save file ------------------------------ */
const SAVE_KEY = "squishyEscape.save.v1";
const freshSave = () => ({
  money: 0, eggTier: 1, counts: {}, equipped: null,
  bestDist: 0, bestMoney: 0, runs: 0, seenIntro: false, muted: false, touchUI: false,
  skin: "classic", accessory: null,
  cloudPlayerId: null, cloudNickname: null   // set once you register/log in for Trade Online
});
let save = (() => {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? Object.assign(freshSave(), JSON.parse(raw)) : freshSave();
  } catch (e) { return freshSave(); }
})();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* --------------------------------- audio -------------------------------- */
let actx = null;
function audioOn() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume();
  if (actx && MUSIC.master === null) { MUSIC.init(); MUSIC.gain(); }
}
function sfx(freq, dur, type = "square", vol = 0.07, slide = 0) {
  if (!actx || save.muted) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const S = {
  jump:  () => sfx(420, 0.16, "square",   0.05,  260),
  double:() => { sfx(560, 0.13, "square", 0.05, 340); setTimeout(() => sfx(840, 0.1, "triangle", 0.04, 220), 45); },
  land:  () => sfx(180, 0.06, "sine",     0.04, -60),
  coin:  () => { sfx(880, 0.07, "triangle", 0.05); setTimeout(() => sfx(1320, 0.09, "triangle", 0.045), 55); },
  stomp: () => sfx(260, 0.13, "sawtooth", 0.055, -170),
  hurt:  () => sfx(300, 0.28, "sawtooth", 0.07, -220),
  click: () => sfx(600, 0.05, "sine", 0.04),
  brickHit:  () => sfx(300, 0.07, "square", 0.05, -80),
  brickBreak:() => { sfx(210, 0.16, "sawtooth", 0.06, -110); setTimeout(() => sfx(340, 0.12, "square", 0.05, -160), 40); },
  creak: () => sfx(160, 0.22, "sawtooth", 0.045, -50),
  slide: () => sfx(240, 0.3, "sawtooth", 0.035, 180),
  star:  () => [0, 60, 120, 180].forEach((d, i) =>
    setTimeout(() => sfx([784, 988, 1175, 1568][i], 0.22, "square", 0.07), d)),
  heart: () => [0, 110].forEach((d, i) => setTimeout(() => sfx([659, 880][i], 0.3, "triangle", 0.07), d)),
  godMode: () => {
    // an original chunky little riser + thump, in the spirit of a classic
    // FPS power-up jingle -- not a sample of anything, just the same vibe
    [0, 70, 140].forEach((d, i) => setTimeout(() =>
      sfx([110, 110, 110][i], 0.16, "sawtooth", 0.09, 60), d));
    setTimeout(() => sfx(55, 0.5, "square", 0.11, -20), 220);
    setTimeout(() => { sfx(440, 0.35, "square", 0.08, 660); sfx(220, 0.35, "sawtooth", 0.07, 220); }, 230);
  },
  boing: () => { sfx(360, 0.1, "sine", 0.06, 260); setTimeout(() => sfx(520, 0.14, "triangle", 0.055, 140), 60); },
  carrot:() => [0, 70, 140, 210, 300, 400].forEach((d, i) =>
    setTimeout(() => sfx([523, 659, 784, 1046, 1318, 1568][i], 0.3, "triangle", 0.075), d)),
  crack: () => sfx(220, 0.08, "square", 0.06, 120),
  hatch: () => [0, 90, 180, 300].forEach((d, i) => setTimeout(() => sfx([523, 659, 784, 1046][i], 0.22, "triangle", 0.06), d))
};


/* ==========================================================================
   8-BIT MUSIC
   No audio files -- every note is synthesised from oscillators and noise.
   Five sections, all of them cheerful and major-key. The hub is a gentle
   version; once you're running, the music steps up a section each time the
   obstacle course unlocks a harder tier of chunks -- a bit quicker and a bit
   busier each time, but always happy. Sections only change on the bar.
   ========================================================================== */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

/* kick/snare/hat use "x" for hit, "." for rest, over 16 sixteenth-notes */
const SECTIONS = {
  hub: { bpm: 96, wave: "triangle", arp: false, swing: 0.06,
    lead: [72, null, null, 76, null, null, 79, null, 76, null, null, 72, null, 74, null, null],
    roots: [48, 48, 53, 55], bassEvery: 8,
    kick: "................", snare: "................", hat: "................" },
  0: { bpm: 112, wave: "square", arp: false, swing: 0.05,
    lead: [72, null, 76, null, 79, null, 76, null, 74, null, 72, null, 74, null, 76, null],
    roots: [48, 48, 53, 55], bassEvery: 4,
    kick: "x...x...x...x...", snare: "................", hat: "..x...x...x...x." },
  1: { bpm: 120, wave: "square", arp: true, swing: 0.04,
    lead: [79, null, 76, 79, 81, null, 79, 76, 74, null, 76, 74, 72, null, 74, 76],
    roots: [48, 53, 55, 53], bassEvery: 4,
    kick: "x...x...x...x...", snare: "....x.......x...", hat: "..x...x...x...x." },
  2: { bpm: 128, wave: "square", arp: true, swing: 0.03,
    lead: [81, 79, 76, 79, 84, 81, 79, 76, 74, 76, 79, 76, 72, 74, 76, 79],
    roots: [48, 53, 55, 55], bassEvery: 2,
    kick: "x..x..x.x..x..x.", snare: "....x.......x...", hat: "x.x.x.x.x.x.x.x." },
  star: { bpm: 168, wave: "square", arp: true, swing: 0,
    lead: [79, 84, 88, 84, 79, 84, 88, 91, 88, 84, 81, 84, 88, 84, 81, 79],
    roots: [48, 48, 53, 55], bassEvery: 2,
    kick: "x.x.x.x.x.x.x.x.", snare: "....x.......x...", hat: "xxxxxxxxxxxxxxxx" },
  cloud: { bpm: 76, wave: "sine", arp: false, swing: 0.1,
    lead: [79, null, 76, null, 72, null, 76, null, 74, null, 79, null, 76, null, null, null],
    roots: [48, 53, 45, 48], bassEvery: 8,
    kick: "x...............", snare: "................", hat: "................" },
  rainbow: { bpm: 152, wave: "triangle", arp: true, swing: 0,
    lead: [84, 88, 91, 88, 93, 91, 88, 84, 86, 88, 91, 93, 91, 88, 86, 84],
    roots: [48, 53, 55, 53], bassEvery: 2,
    kick: "x...x...x...x...", snare: "................", hat: "x.x.x.x.x.x.x.x." },
  3: { bpm: 138, wave: "square", arp: true, swing: 0.03,
    lead: [84, 81, 79, 81, 84, 86, 84, 81, 79, 76, 74, 76, 79, 81, 84, 86],
    roots: [48, 53, 55, 48], bassEvery: 2,
    kick: "x..x..x.x..x..x.", snare: "....x.......x...", hat: "x.x.x.x.x.x.x.x." }
};

const MUSIC = {
  master: null, noise: null, timer: null,
  mode: "off", sec: SECTIONS.hub, step: 0, next: 0, level: -1,

  init() {
    if (!actx || this.master) return;
    this.master = actx.createGain();
    this.master.gain.value = save.muted ? 0 : 0.5;
    this.master.connect(actx.destination);
    const b = actx.createBuffer(1, actx.sampleRate * 0.4, actx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.noise = b;
  },
  gain() { if (this.master) this.master.gain.value = save.muted ? 0 : 0.5; },

  setMode(m) {
    if (m !== "off") { audioOn(); this.init(); }
    if (!this.master) { this.mode = m; return; }
    if (this.mode === m) return;
    this.mode = m;
    if (m === "off") { clearInterval(this.timer); this.timer = null; return; }
    this.level = -1;
    this.pickSection();
    this.step = 0;
    this.next = actx.currentTime + 0.06;
    if (!this.timer) this.timer = setInterval(() => this.tick(), 25);
  },

  /* which section should be playing right now */
  pickSection() {
    if (this.mode === "hub") { this.sec = SECTIONS.hub; this.level = -1; return; }
    if (this.mode === "rainbow") { this.sec = SECTIONS.rainbow; this.level = -2; return; }
    if (this.mode === "cloud")   { this.sec = SECTIONS.cloud;   this.level = -4; return; }
    if (this.mode === "star")    { this.sec = SECTIONS.star;    this.level = -3; return; }
    // these thresholds line up with where the course unlocks harder chunks
    const lvl = run.dist < 80 ? 0 : run.dist < 176 ? 1 : run.dist < 320 ? 2 : 3;
    if (lvl !== this.level) { this.level = lvl; this.sec = SECTIONS[lvl]; }
  },

  tick() {
    if (!actx || this.mode === "off") return;
    const ahead = actx.currentTime + 0.15;
    let guard = 0;
    while (this.next < ahead && guard++ < 60) {
      this.playStep(this.next, this.step);
      const sixteenth = 60 / this.sec.bpm / 4;
      // a touch of swing on the calmer sections
      this.next += sixteenth * (this.step % 2 ? 1 - this.sec.swing : 1 + this.sec.swing);
      this.step = (this.step + 1) % 16;
      if (this.step === 0) this.pickSection();   // only ever change section on the bar
    }
  },

  playStep(t, i) {
    const S2 = this.sec, beat = (i / 4) | 0, root = S2.roots[beat];
    const dur = 60 / S2.bpm / 4;

    if (S2.lead[i] != null) this.tone(t, S2.lead[i], dur * 1.7, 0.055, S2.wave);
    if (i % S2.bassEvery === 0) this.bass(t, root - 12, dur * 1.6, 0.055);
    if (S2.arp) this.tone(t, root + [12, 19, 24, 19][i % 4], dur * 0.8, 0.022, "square");
    if (S2.kick[i]  === "x") this.kick(t, this.mode === "cloud" ? 0.045 : 0.085);
    if (S2.snare[i] === "x") this.hit(t, 0.095, 0.045, 1500, "bandpass");
    if (S2.hat[i]   === "x") this.hit(t, 0.035, 0.018, 7200, "highpass");
  },

  tone(t, midi, dur, vol, type) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(mtof(midi), t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.03);
  },
  bass(t, midi, dur, vol) {
    const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
    o.type = "square"; f.type = "lowpass"; f.frequency.value = 820;
    o.frequency.setValueAtTime(mtof(midi), t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(f); f.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.03);
  },
  kick(t, vol) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(155, t);
    o.frequency.exponentialRampToValueAtTime(46, t + 0.11);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.14);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.17);
  },
  hit(t, vol, dur, freq, type) {
    const src = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
    src.buffer = this.noise;
    f.type = type; f.frequency.value = freq; f.Q.value = type === "bandpass" ? 1.2 : 0.7;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.02);
  },

  /* short riff when a run ends */
  stinger() {
    if (!this.master || save.muted) return;
    const t0 = actx.currentTime + 0.05;
    [[72, 0], [76, 0.12], [79, 0.24], [84, 0.36]].forEach(([m, d]) =>
      this.tone(t0 + d, m, d === 0.36 ? 0.5 : 0.16, 0.06, "square"));
  }
};

function rollSquishy() {
  const odds = eggDef().odds;
  let r = Math.random() * odds.reduce((a, b) => a + b, 0), tier = 0;
  for (let i = 0; i < odds.length; i++) { if (r < odds[i]) { tier = i; break; } r -= odds[i]; }
  return pickOfRarity(tier);
}
function pickOfRarity(tier) {
  const pool = SQUISHIES.filter(s => s.r === tier);
  return pool[(Math.random() * pool.length) | 0];
}

}

const keys = Object.create(null);
const input = { left:false, right:false, jumpHeld:false, jumpPressed:false };
function setJump(down) {
  if (down && !input.jumpHeld) input.jumpPressed = true;
  input.jumpHeld = down;
}
let cheatBuffer = "";
addEventListener("keydown", e => {
  if (e.repeat) return;
  audioOn();
  keys[e.code] = true;
  if (["Space","ArrowUp","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") setJump(true);
  if (e.code === "KeyM") toggleMute();
  if ((e.code === "KeyP" || e.code === "Escape") && (game.state === "play" || game.state === "paused")) togglePause();
  // a little Easter egg for the menu screen -- type IDFKA
  // e.code (physical key position) is preferred, but falls back to e.key so
  // this still works on virtual keyboards / IMEs where code can be unreliable
  if (game.state === "hub") {
    const letter = /^Key[A-Z]$/.test(e.code) ? e.code[3]
                 : /^[a-zA-Z]$/.test(e.key)   ? e.key.toUpperCase()
                 : null;
    if (letter) {
      cheatBuffer = (cheatBuffer + letter).slice(-5);
      if (cheatBuffer === "IDFKA") { cheatBuffer = ""; activateGodMode(); }
    }
  }
});
addEventListener("keyup", e => {
  keys[e.code] = false;
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") setJump(false);
});
addEventListener("blur", () => { for (const k in keys) keys[k] = false; input.jumpHeld = false; });

function pollInput() {
  input.left  = !!(keys.ArrowLeft  || keys.KeyA) || touchState.left;
  input.right = !!(keys.ArrowRight || keys.KeyD) || touchState.right;
}
const touchState = { left:false, right:false };
/* Don't trust a one-shot sniff -- iPadOS Safari defaults to "Request Desktop
   Website", where `ontouchstart` is false. Guess up front, but the real trigger
   is the first actual touch, and we remember it for next time. */
function enableTouchUI() {
  if (document.body.classList.contains("touch")) return;
  document.body.classList.add("touch");
  if (!save.touchUI) { save.touchUI = true; persist(); }
}
if (save.touchUI || "ontouchstart" in window || navigator.maxTouchPoints > 0) {
  document.body.classList.add("touch");
}
addEventListener("touchstart", enableTouchUI, { passive: true, capture: true });
addEventListener("pointerdown", e => { if (e.pointerType === "touch") enableTouchUI(); },
                 { passive: true, capture: true });
function bindTouch(el, on, off) {
  el.addEventListener("touchstart", e => { e.preventDefault(); audioOn(); on(); }, { passive:false });
  el.addEventListener("touchend",   e => { e.preventDefault(); off(); }, { passive:false });
  el.addEventListener("touchcancel",e => { e.preventDefault(); off(); }, { passive:false });
}

bindTouch(document.getElementById("tcRight"), () => touchState.right = true, () => touchState.right = false);

/* ------------------------------ world state ----------------------------- */
const world = {
  tiles: new Map(),   // chunk index -> array of 12 strings (solids only)
  built: -1,          // highest chunk index generated so far
  coins: [], hazards: [], enemies: [], rings: [], parts: [], texts: [], pickups: [], movers: [], lastPickup: -99, lastCarrot: -99
};
// stable per-entity ids, assigned at creation -- inert for solo play, used by
// the shared arena to address coins/enemies/etc across the network
let nextEntityId = 1;
const newEntityId = () => nextEntityId++;

// shared by resetWorld() and the coop guest's clear-without-generating below
function clearWorld() {
  world.tiles.clear(); world.built = -1;
  world.coins.length = world.hazards.length = 0;
  world.enemies.length = world.rings.length = world.parts.length = world.texts.length = 0;
  world.pickups.length = 0; world.movers.length = 0;
  world.lastPickup = -99; world.lastCarrot = -99;
}

function resetWorld() {
  clearWorld();
  for (let i = 0; i <= 3; i++) buildChunk(i);
}

// A coop guest must NEVER call buildChunk() itself (that would generate its
// own random layout instead of the host's) -- clear local state and wait
// for the host's chunk broadcasts to populate it.
function clearWorldForCoopGuest() {
  clearWorld();
}

function pickTemplate(index) {
  // gentle intro, then let harder tiers into the pool as you get further out
  if (index <= 1) return TEMPLATES[0];
  const maxTier = index < 5 ? 0 : index < 11 ? 1 : index < 20 ? 2 : 3;
  const pool = TEMPLATES.filter(t => t.tier <= maxTier);
  // bias toward the nastiest tier currently unlocked
  const hot = pool.filter(t => t.tier === maxTier);
  const use = (maxTier > 0 && Math.random() < 0.55) ? hot : pool;
  return use[(Math.random() * use.length) | 0];
}

/* mirroring a ramp needs its direction swapped, everything else reads as-is */
const mirrorChar = ch => ch === ">" ? "<" : ch === "<" ? ">" : ch;

function buildChunk(index) {
  if (world.tiles.has(index)) return;
  const tpl = pickTemplate(index);
  // stamping the same hand-built piece flipped left-right, at random, makes
  // every template read as two different pieces for free -- ramps, patrols,
  // coin arcs and drop timing all run the other way half the time.
  const mirror = Math.random() < 0.5;
  const solid = [];
  for (let r = 0; r < ROWS; r++) {
    let line = "";
    for (let c = 0; c < COLS; c++) {
      const ch = mirror ? mirrorChar(tpl.rows[r][COLS - 1 - c]) : tpl.rows[r][c];
      const wx = index * CHUNK_W + c * TILE, wy = r * TILE;
      switch (ch) {
        case "o": world.coins.push({ _id:newEntityId(), x:wx + TILE/2, y:wy + TILE/2, got:false, t:Math.random()*6 }); break;
        case "D": case "S": case "P": case "N": case "B":
          world.hazards.push({ _id:newEntityId(), x:wx + TILE/2, y:wy + TILE - 17, kind:ch, t:Math.random()*6 }); break;
        case "X": world.movers.push({ _id:newEntityId(), kind:"X", ci:index, row:r, col:c,
                    x:wx + TILE/2, y:wy + TILE/2, hits:0, shake:0 }); break;
        case "T": world.movers.push({ _id:newEntityId(), kind:"T", x:wx + TILE/2, y:wy + TILE - 15,
                    squish:0, spent:0, t:Math.random()*6 }); break;
        case "=": world.movers.push({ _id:newEntityId(), kind:"P", ci:index, row:r, col:c,
                    x:wx + TILE/2, y:wy + TILE/2, state:"solid", timer:0, fy:0, vy:0 }); break;
        case "?": world.hazards.push({ _id:newEntityId(), x:wx + TILE/2, y:wy + TILE - 17,
                    kind:"DSPNB"[(Math.random()*5)|0], t:Math.random()*6 }); break;
        case "F": world.movers.push({ _id:newEntityId(), kind:"F", x:wx + TILE/2, y0:wy + TILE/2, y:wy + TILE/2,
                    vy:0, state:"hang", timer:0, t:Math.random()*6 }); break;
        case "W": world.movers.push({ _id:newEntityId(), kind:"W", x0:wx + TILE/2, x:wx + TILE/2, y:wy + TILE - 19,
                    vx:-118, rot:0, state:"roll", timer:0, t:0 }); break;
        case "Z": world.movers.push({ _id:newEntityId(), kind:"Z", x:wx + TILE/2, y0:wy + TILE - 17, y:wy + TILE - 17,
                    phase:Math.random()*3, t:0 }); break;
        case "!":
          // a carrot, but only if we haven't handed one out recently
          if (index - world.lastCarrot >= 6) {
            world.pickups.push({ _id:newEntityId(), x:wx + TILE/2, y:wy + TILE/2, kind:"carrot", got:false, t:Math.random()*6 });
            world.lastCarrot = index;
          }
          break;
        case "R": world.rings.push({ _id:newEntityId(), x:wx + TILE/2, y:wy + TILE/2, base:wy + TILE/2, a:Math.random()*6.28 }); break;
        case "6": world.enemies.push(makeEnemy(wx + TILE/2, wy + TILE, "6")); break;
        case "7": world.enemies.push(makeEnemy(wx + TILE/2, wy + TILE, "7")); break;
      }
      line += "#C=><X".indexOf(ch) >= 0 ? ch : ".";
    }
    solid.push(line);
  }
  /* Every so often, tuck a special pickup somewhere jumpable. Never two close
     together -- it should feel like a lucky find, not a pickup line.
     Carrots aren't placed here -- they only appear on the "!" markers that the
     course pieces put up high, so you have to climb for them. */
  if (index >= 3 && index - world.lastPickup >= 7 && Math.random() < 0.3) {
    const spots = [];
    for (let c = 2; c < COLS - 2; c++) {
      if (solid[ROWS - 1][c] === "#" && solid[8][c] === "." && solid[7][c] === "." && solid[9][c] === ".") spots.push(c);
    }
    if (spots.length) {
      const c = spots[(Math.random() * spots.length) | 0];
      world.pickups.push({ _id: newEntityId(), x: index * CHUNK_W + c * TILE + TILE/2, y: 8 * TILE + TILE/2,
                           kind: "star", got: false, t: Math.random() * 6 });
      world.lastPickup = index;
    }
  }

  world.tiles.set(index, solid);
  world.built = Math.max(world.built, index);
}

function makeEnemy(cx, footY, kind) {
  return {
    _id: newEntityId(),
    x: cx - 17, y: footY - 36, w: 34, h: 36,
    vx: (Math.random() < 0.5 ? -1 : 1) * (kind === "6" ? 62 : 40), vy: 0,
    kind, onGround: false, hopT: 0.4 + Math.random(), dead: 0, t: Math.random() * 6
  };
}

/* tile char at a world pixel; anything off the top/bottom or before the
   start of the course is treated as empty (falling off = lose a heart). */
function tileAtPx(px, py) {
  const row = Math.floor(py / TILE);
  if (row < 0 || row >= ROWS) return ".";
  const col = Math.floor(px / TILE);
  const ci = Math.floor(col / COLS);
  if (ci < 0) return row === ROWS - 1 ? "#" : ".";
  const t = world.tiles.get(ci);
  if (!t) return ".";
  return t[row][col - ci * COLS] || ".";
}
function equippedPower() {
  if (!save.equipped) return null;
  const def = byId(save.equipped);
  return def ? def.power || null : null;
}

const isSolidPx = (px, py) => {
  const c = tileAtPx(px, py);
  return c === "#" || c === "C" || c === "=" || c === "X";
};

/* Slopes are single 45-degree tiles. ">" climbs to the right, "<" drops to the
   right. This gives the height of the slope surface at a given world x, plus
   which way is downhill, or null if that spot isn't a slope. */
function slopeAt(px, py) {
  const ch = tileAtPx(px, py);
  if (ch !== ">" && ch !== "<") return null;
  const col = Math.floor(px / TILE), row = Math.floor(py / TILE);
  const fx = Math.max(0, Math.min(1, (px - col * TILE) / TILE));
  return { y: row * TILE + TILE * (ch === ">" ? 1 - fx : fx), dir: ch === ">" ? -1 : 1 };
}

function setTile(ci, row, col, ch) {
  const t = world.tiles.get(ci);
  if (!t) return;
  t[row] = t[row].substring(0, col) + ch + t[row].substring(col + 1);
}

/* Axis-separated AABB vs tile collision. Returns what it bumped into. */
function moveBody(b, dt, stepUp) {
  stepUp = stepUp === undefined ? STEP_UP : stepUp;
  const res = { ground:false, ceil:false, wall:false };
  const wasGround = !!b.onGround;
  // --- horizontal ---
  b.x += b.vx * dt;
  if (b.vx !== 0) {
    const dir = Math.sign(b.vx);
    const edge = dir > 0 ? b.x + b.w : b.x;
    // every height along the leading edge that is inside something solid
    let blockTop = null;
    for (let y = b.y + 2; y <= b.y + b.h - 3; y += Math.min(TILE - 4, b.h - 5)) {
      if (isSolidPx(edge, y)) {
        const top = Math.floor(y / TILE) * TILE;
        if (blockTop === null || top < blockTop) blockTop = top;
      }
    }
    if (isSolidPx(edge, b.y + b.h - 3)) {
      const top = Math.floor((b.y + b.h - 3) / TILE) * TILE;
      if (blockTop === null || top < blockTop) blockTop = top;
    }
    if (blockTop !== null) {
      const rise = (b.y + b.h) - blockTop;
      const clear = !isSolidPx(edge, blockTop - 6) &&
                    !isSolidPx(edge, blockTop - b.h + 4) &&
                    !isSolidPx(b.x + b.w / 2, blockTop - b.h + 4);
      if (wasGround && rise > 0 && rise <= stepUp && clear) {
        b.y = blockTop - b.h - 0.01;      // just walk up over the lip
        if (b.vy > 0) b.vy = 0;
        res.ground = true;
      } else {
        const col = Math.floor(edge / TILE);
        b.x = dir > 0 ? col * TILE - b.w - 0.01 : (col + 1) * TILE + 0.01;
        b.vx = 0; res.wall = true;
      }
    }
  }
  // --- vertical ---
  b.vy = Math.min(b.vy + GRAVITY * dt, MAX_FALL);
  b.y += b.vy * dt;
  const edgeY = b.vy > 0 ? b.y + b.h : b.y;
  for (let x = b.x + 3; x <= b.x + b.w - 3; x += Math.min(TILE - 6, b.w - 6)) {
    if (isSolidPx(x, edgeY)) {
      const row = Math.floor(edgeY / TILE);
      if (b.vy > 0) { b.y = row * TILE - b.h - 0.01; res.ground = true; }
      else          { b.y = (row + 1) * TILE + 0.01; res.ceil = true; }
      b.vy = 0; break;
    }
  }
  if (!res.ground && b.vy > 0 && isSolidPx(b.x + b.w - 3, b.y + b.h)) {
    const row = Math.floor((b.y + b.h) / TILE);
    b.y = row * TILE - b.h - 0.01; b.vy = 0; res.ground = true;
  }
  /* --- ride up and down slopes --- */
  res.slope = 0;
  const footX = b.x + b.w / 2;
  for (let d = 0; d <= 1; d++) {
    const sl = slopeAt(footX, b.y + b.h - 2 + d * TILE);
    if (!sl) continue;
    const feet = b.y + b.h;
    // standing on (or sunk into) the ramp
    if (feet > sl.y - 1 && feet < sl.y + TILE) {
      b.y = sl.y - b.h; if (b.vy > 0) b.vy = 0;
      res.ground = true; res.slope = sl.dir;
      break;
    }
    // just stepped off a flat tile onto a downhill ramp -- hug it instead of
    // launching off the edge
    if (wasGround && b.vy >= 0 && sl.y > feet && sl.y - feet < 20) {
      b.y = sl.y - b.h; b.vy = 0;
      res.ground = true; res.slope = sl.dir;
      break;
    }
  }
  return res;
}

/* ==========================================================================
   THE RUN
   ========================================================================== */
const game   = { state:"hub", t:0, shake:0, hatch:null };
const player = { x:100, y:455, w:30, h:40, vx:0, vy:0, prevY:455, onGround:false,
                 face:1, coyote:0, buffer:0, iframes:0, hearts:3, anim:0, squash:0, combo:0, airJumps:1, star:0,
                 slide:false, slopeDir:0, lastSlope:0, slopeGrace:0, slideSfx:0, runT:0, runDir:0,
                 power:null, flyFuel:FLY_TIME, flying:false, cloudMusic:0 };
const run    = { money:0, coins:0, stomps:0, dist:0, maxX:100, wallX:-420, camX:0, camY:0, over:false, endT:0, rainbow:null };
const trail  = [];   // breadcrumb positions so the companion squishy can follow

/* ==========================================================================
   SHARED ARENA (host-authoritative co-op) -- entirely additive alongside the
   singular `player`/`run` above, which stay untouched for solo play. The
   room host simulates every PlayerEntity + the shared `world`; other clients
   just forward input and render whatever the host broadcasts. See the plan
   for the full design; this is Stage 1 -- movement/collision only, no
   coins/bricks/wall/enemies/hearts yet.
   ========================================================================== */
const coop = {
  active: false,
  players: new Map(),     // playerId -> PlayerEntity, host-authoritative
  tick: 0,
  lastSnapshotT: 0,
  lastSnapshot: null,     // guest-side: most recent host snapshot
  camX: 0,                // per-client camera, independent of the host's
  lastSentInput: null,
  lastInputSentT: 0,
  myJumpSeq: 0,
  remoteAnim: new Map(),  // guest-side only: locally-accumulated run-cycle phase per remote player id
  gotCoins: [], gotPickups: [],  // host-only: newly-collected ids since the last snapshot
  over: false, overT: 0, resultsShown: false,
};

function makePlayerEntity(playerId, nickname, cosmetics) {
  cosmetics = cosmetics || {};
  return {
    id: playerId, nickname,
    x:100, y:455, w:30, h:40, vx:0, vy:0, prevY:455, onGround:false,
    face:1, coyote:0, buffer:0, iframes:0, hearts:3, anim:0, squash:0, combo:0, airJumps:1, star:0,
    slide:false, slopeDir:0, lastSlope:0, slopeGrace:0, runT:0, runDir:0,
    power: cosmetics.power || null, flyFuel: FLY_TIME, flying:false,
    alive:true, eliminated:null,
    money:0, coins:0, stomps:0, maxX:100,
    input: { left:false, right:false, jumpHeld:false },
    jumpSeq:0, lastJumpSeqSeen:0,
  };
}

function startRun() {
  audioOn();
  resetWorld();
  player.x = 100; player.y = 455; player.vx = player.vy = 0; player.prevY = 455;
  player.onGround = true; player.face = 1; player.coyote = COYOTE; player.buffer = 0;
  player.iframes = 0; player.hearts = 3; player.anim = 0; player.squash = 0; player.combo = 0; player.airJumps = 1; player.star = 0;
  player.slide = false; player.slopeDir = 0; player.lastSlope = 0;
  player.slopeGrace = 0; player.slideSfx = 0; player.runT = 0; player.runDir = 0;
  player.power = equippedPower(); player.flyFuel = FLY_TIME; player.flying = false;
  player.cloudMusic = 0;
  run.money = run.coins = run.stomps = run.dist = 0;
  run.maxX = 100; run.wallX = -420; run.camX = 0; run.camY = 0; run.over = false; run.endT = 0;
  run.rainbow = null;
  trail.length = 0;
  game.state = "play"; game.shake = 0;
  showMenu(null);
  setPlayUI(true);
  MUSIC.setMode("run");
}

/* hearts/coins readout, the on-screen buttons and the pause button all appear
   together for the length of a run */
function setPlayUI(on) {
  document.getElementById("hud").classList.toggle("on", on);
  document.getElementById("touch").classList.toggle("on", on);
  document.body.classList.toggle("playing", on);
}

function endRun(cause) {
  if (run.over) return;
  run.over = true; run.endT = 0;
  game.shake = 16;
  MUSIC.setMode("off"); MUSIC.stinger();
  const bonus = Math.floor(run.dist / 5);
  run.money += bonus; run.bonus = bonus; run.cause = cause;
  save.money += run.money;
  save.runs++;
  save.bestDist  = Math.max(save.bestDist, run.dist);
  save.bestMoney = Math.max(save.bestMoney, run.money);
  persist();
  // post the new score to the leaderboard, registered players only -- any
  // failure surfaces as mp.syncNotice next time the hub renders, rather
  // than silently doing nothing
  if (save.cloudPlayerId) {
    if (window.MP && MP.available()) {
      MP.updateSave({ best_dist: save.bestDist, best_money: save.bestMoney, money: save.money, runs: save.runs })
        .then(() => { mp.syncNotice = null; })
        .catch(err => {
          if (err && err.code === "not_registered") {
            // this device's sign-in doesn't actually exist any more (e.g. it
            // expired, or this profile got logged in from elsewhere) -- the
            // hub was falsely claiming "signed in", so clear that and say why
            save.cloudPlayerId = null; save.cloudNickname = null; persist();
            mp.playerId = null; mp.nickname = null;
            mp.syncNotice = "⚠️ You got signed out, so this run didn't save — tap Sign Up on the hub to log back in.";
          } else {
            mp.syncNotice = "⚠️ Your last score didn't save online — try signing in again.";
          }
        });
    } else {
      mp.syncNotice = "⚠️ Couldn't reach the leaderboard to save your score (you're still saved locally).";
    }
  }
}

/* Head-butting a brick from below cracks it; three goes and it bursts, leaving
   a hole you can jump straight through. */
function bumpBrick(px, py) {
  if (tileAtPx(px, py) !== "X") return false;
  const col = Math.floor(px / TILE), row = Math.floor(py / TILE);
  const ci = Math.floor(col / COLS), lc = col - ci * COLS;
  const m = world.movers.find(v => v.kind === "X" && v.ci === ci && v.row === row && v.col === lc);
  if (!m || m.hits >= BRICK_HITS) return false;
  m.hits++; m.shake = 0.2;
  game.shake = Math.max(game.shake, 3);
  if (m.hits >= BRICK_HITS) {
    setTile(ci, row, lc, ".");
    burst(m.x, m.y, "#c9925a", 22, 280);
    burst(m.x, m.y, "#e8bd86", 12, 200);
    S.brickBreak(); game.shake = 7;
    run.money += 2;
    floatText(m.x, m.y - 14, "+2", "#e8bd86");
  } else {
    burst(m.x, m.y - 12, "#d8a56a", 7, 150);
    S.brickHit();
  }
  return true;
}

function grabStar(cx, cy) {
  player.star = STAR_TIME;
  game.shake = 10;
  S.star();
  MUSIC.setMode("star");
  floatText(cx, cy - 20, "INVINCIBLE!", "#ffe97a");
  for (let i = 0; i < 5; i++) {
    burst(cx, cy, ["#ffe97a","#fff6c2","#ffd36b","#ffffff","#ffb3d4"][i], 8, 300);
  }
}

function hurt() {
  if (player.iframes > 0 || run.over || player.star > 0) return;
  player.hearts--; player.iframes = IFRAMES; player.combo = 0;
  player.vy = -320; player.vx = -220 * player.face;
  game.shake = 11; S.hurt();
  burst(player.x + player.w/2, player.y + player.h/2, "#ff9fc4", 14);
  if (player.hearts <= 0) endRun("squashed");
}

function puffRing(x, y) {
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    world.parts.push({ x, y, vx: Math.cos(a) * 130, vy: Math.sin(a) * 55 - 20,
                       life: 0, max: 0.32, color: "#ffffff", size: 3.4 });
  }
}

function floatText(x, y, txt, color) {
  world.texts.push({ x, y, txt, color, life: 0, max: 0.95 });
}

function burst(x, y, color, n, spd = 220) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (0.35 + Math.random() * 0.8);
    world.parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 60,
                       life:0, max:0.35 + Math.random()*0.4, color, size:2 + Math.random()*4 });
  }
}

function respawnFromPit() {
  // dropped into a gap: lose a heart, then get set back down on solid ground
  let col = Math.floor(player.x / TILE);
  for (let i = 0; i < 200; i++) {
    const px = (col + i) * TILE + TILE/2;
    if (isSolidPx(px, (ROWS - 1) * TILE + 4)) {
      player.x = px - player.w/2;
      player.y = (ROWS - 1) * TILE - player.h - 90;
      player.vx = 0; player.vy = 0;
      hurt();
      return;
    }
  }
  player.x += TILE * 3; player.y = 200; player.vx = player.vy = 0; hurt();
}

/* ---- Shared-arena Stage 1: movement/collision only, for one PlayerEntity.
   Deliberately duplicated from the solo movement block above rather than
   shared, so the working solo path can never regress from this. No hearts,
   coins, hazards, bricks, or wall yet -- those come in later stages. ---- */
function respawnPlayerEntityFromPit(p) {
  let col = Math.floor(p.x / TILE);
  for (let i = 0; i < 200; i++) {
    const px = (col + i) * TILE + TILE/2;
    if (isSolidPx(px, (ROWS - 1) * TILE + 4)) {
      p.x = px - p.w/2; p.y = (ROWS - 1) * TILE - p.h - 90; p.vx = 0; p.vy = 0;
      hurtP(p);
      return;
    }
  }
  p.x += TILE * 3; p.y = 200; p.vx = p.vy = 0; hurtP(p);
}

function stepPlayerEntity(p, dt) {
  let dir = (p.input.right ? 1 : 0) - (p.input.left ? 1 : 0);

  if (dir !== 0 && dir === p.runDir) p.runT += dt;
  else { p.runT = 0; p.runDir = dir; }
  const wind = Math.max(0, Math.min(1, (p.runT - SPRINT_AFTER) / SPRINT_RAMP));
  const speedMult = p.power === "speed" ? POWER_SPEED_MULT : 1;
  const topSpeed = (MAX_RUN + (SPRINT_RUN - MAX_RUN) * wind) * speedMult;

  if (p.slopeDir !== 0) { p.lastSlope = p.slopeDir; p.slopeGrace = 0.28; }
  else p.slopeGrace = Math.max(0, p.slopeGrace - dt);
  const onSlope = p.slopeDir !== 0 || p.slopeGrace > 0;
  const downhill = p.slopeDir !== 0 ? p.slopeDir : p.lastSlope;
  const fightingIt = dir !== 0 && downhill !== 0 && dir === -downhill;
  p.slide = p.onGround && onSlope && !fightingIt && downhill !== 0;
  if (p.slide) {
    p.vx += downhill * SLIDE_ACCEL * dt;
    p.vx = Math.max(-SLIDE_MAX, Math.min(SLIDE_MAX, p.vx));
    if (downhill !== 0) p.face = downhill;
  } else {
    const accel = p.onGround ? RUN_ACCEL : AIR_ACCEL;
    if (dir !== 0) {
      p.vx += dir * accel * dt;
      p.vx = Math.max(-topSpeed, Math.min(topSpeed, p.vx));
      p.face = dir;
    } else if (p.onGround) {
      const f = FRICTION * dt;
      p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f;
    }
  }

  /* jump: edge-triggered off jumpSeq (a counter, not a boolean) so a press
     can never be lost between two ~15Hz network input messages */
  if (p.jumpSeq !== p.lastJumpSeqSeen) { p.lastJumpSeqSeen = p.jumpSeq; p.buffer = JUMP_BUFFER; }
  p.buffer -= dt; p.coyote -= dt;
  const jumpMult = p.power === "jump" ? POWER_JUMP_MULT : 1;
  if (p.buffer > 0 && p.coyote > 0) {
    p.vy = -JUMP_V * jumpMult; p.buffer = 0; p.coyote = 0;
    p.onGround = false; p.squash = -0.35;
  } else if (p.buffer > 0 && p.airJumps > 0 && !p.onGround) {
    p.airJumps--; p.buffer = 0;
    p.vy = -JUMP_V * DOUBLE_V * jumpMult; p.squash = -0.45;
  }
  if (p.vy < 0 && !p.input.jumpHeld) p.vy *= Math.pow(JUMP_CUT, dt * 60 / 8);

  p.prevY = p.y;
  const hit = moveBody(p, dt, p.power === "big" ? STEP_UP * POWER_BIG_STEP : STEP_UP);
  p.slopeDir = hit.slope || 0;
  if (hit.ceil) {
    const hy = p.y - 5;
    bumpBrickFor(p, p.x + 5, hy) || bumpBrickFor(p, p.x + p.w/2, hy) || bumpBrickFor(p, p.x + p.w - 5, hy);
  }
  if (hit.ground) {
    if (!p.onGround) p.squash = 0.45;
    p.onGround = true; p.coyote = COYOTE; p.combo = 0; p.airJumps = 1;
  } else {
    if (p.onGround) p.coyote = COYOTE;
    p.onGround = false;
  }
  if (p.y > H + 120) respawnPlayerEntityFromPit(p);
  p.iframes = Math.max(0, p.iframes - dt);
  if (p.star > 0) { p.star -= dt; if (p.star <= 0) p.star = 0; }

  p.anim += dt * (p.onGround ? Math.abs(p.vx) / 42 : 4);
  p.squash += (0 - p.squash) * Math.min(1, dt * 12);
  p.maxX = Math.max(p.maxX, p.x);
}

/* ---- Stage 2: per-player damage/scoring actions, credited individually ---- */
function eliminatePlayerCoop(p, cause) {
  if (p.eliminated) return;   // idempotency guard, same reasoning as endRun's `if (run.over) return`
  p.eliminated = cause; p.alive = false;
}

function hurtP(p) {
  if (!p.alive || p.iframes > 0 || p.star > 0) return;
  p.hearts--; p.iframes = IFRAMES; p.combo = 0;
  p.vy = -320; p.vx = -220 * p.face;
  game.shake = 11; S.hurt();
  burst(p.x + p.w/2, p.y + p.h/2, "#ff9fc4", 14);
  if (p.hearts <= 0) eliminatePlayerCoop(p, "hearts");
}

function grabStarFor(p, cx, cy) {
  p.star = STAR_TIME;
  game.shake = 10; S.star();
  floatText(cx, cy - 20, "INVINCIBLE!", "#ffe97a");
  for (let i = 0; i < 5; i++) burst(cx, cy, ["#ffe97a","#fff6c2","#ffd36b","#ffffff","#ffb3d4"][i], 8, 300);
}

function bumpBrickFor(p, px, py) {
  if (tileAtPx(px, py) !== "X") return false;
  const col = Math.floor(px / TILE), row = Math.floor(py / TILE);
  const ci = Math.floor(col / COLS), lc = col - ci * COLS;
  const m = world.movers.find(v => v.kind === "X" && v.ci === ci && v.row === row && v.col === lc);
  if (!m || m.hits >= BRICK_HITS) return false;
  m.hits++; m.shake = 0.2;
  game.shake = Math.max(game.shake, 3);
  if (m.hits >= BRICK_HITS) {
    setTile(ci, row, lc, ".");
    if (mp.isCoopHost) MP.broadcastCoopTile(mp.sessionId, { index: ci, row, col: lc, ch: "." });
    burst(m.x, m.y, "#c9925a", 22, 280); burst(m.x, m.y, "#e8bd86", 12, 200);
    S.brickBreak(); game.shake = 7;
    p.money += 2;
    floatText(m.x, m.y - 14, "+2", "#e8bd86");
  } else {
    burst(m.x, m.y - 12, "#d8a56a", 7, 150);
    S.brickHit();
  }
  return true;
}

/* the shape of the rainbow in world space -- the road and the coins on it both
   come from this one function, so the coins always sit on the rainbow */
const rainbowY = wx => 292 + Math.sin(wx * 0.0016) * 132 + Math.sin(wx * 0.0007) * 58;

function startRainbow(cx, cy) {
  run.rainbow = { t: 0, ry: player.y, vy: -540, coins: [], got: 0, launch: 0.55 };
  for (let i = 0; i < 54; i++) {
    const x = player.x + 520 + i * 74;
    run.rainbow.coins.push({ x, y: rainbowY(x), got: false });
  }
  game.shake = 14;
  burst(cx, cy, "#ffb347", 26, 340);
  for (let i = 0; i < 26; i++) {
    burst(cx + (Math.random() - 0.5) * 60, cy + (Math.random() - 0.5) * 60,
          ["#ff9fc4","#ffe97a","#a9edc4","#9ecdff","#c3a9ff"][(Math.random()*5)|0], 2, 260);
  }
  S.carrot();
  MUSIC.setMode("rainbow");
}

function endRainbow() {
  // set back down on solid ground, wherever we've drifted to
  let col = Math.floor(player.x / TILE);
  for (let i = 0; i < 300; i++) {
    const px = (col + i) * TILE + TILE/2;
    if (isSolidPx(px, (ROWS - 1) * TILE + 4)) { player.x = px - player.w/2; break; }
  }
  player.y = (ROWS - 1) * TILE - player.h - 210;
  player.vx = 0; player.vy = 0; player.onGround = false;
  player.airJumps = 1; player.iframes = 0.9;
  // collect more than half the rainbow and you earn a heart back
  const R = run.rainbow;
  if (R && R.coins.length && R.got / R.coins.length > 0.5 && player.hearts < MAX_HEARTS) {
    player.hearts++;
    S.heart();
    floatText(player.x + player.w/2, player.y - 10, "+1 HEART!", "#ff9fc4");
    burst(player.x + player.w/2, player.y, "#ff9fc4", 22, 260);
  }
  // the wall waited for you -- park it at the leash so it doesn't snap forward
  run.wallX = player.x - WALL_LEASH + 60;
  run.rainbow = null;
  MUSIC.setMode(player.star > 0 ? "star" : "run");
}

function updateRainbow(dt) {
  const R = run.rainbow;
  pollInput();
  R.t += dt;
  game.shake *= Math.pow(0.0016, dt);

  if (R.launch > 0) {
    // the initial whoosh upward before you take the controls
    R.launch -= dt;
    R.vy += 900 * dt;
    R.ry += R.vy * dt;
    if (R.launch <= 0) R.ry = Math.max(90, Math.min(H - 90, R.ry));
  } else {
    R.vy += (input.jumpHeld ? -RAINBOW_LIFT : RAINBOW_FALL) * dt;
    R.vy = Math.max(-RAINBOW_VMAX, Math.min(RAINBOW_VMAX, R.vy));
    R.ry += R.vy * dt;
    if (R.ry < 70)     { R.ry = 70;     R.vy = Math.max(R.vy, 0); }
    if (R.ry > H - 76) { R.ry = H - 76; R.vy = Math.min(R.vy, 0); }
  }

  player.x += RAINBOW_SPEED * dt;
  player.anim += dt * 7;
  run.maxX = Math.max(run.maxX, player.x);
  run.dist = Math.max(0, Math.floor((run.maxX - 100) / TILE));
  while ((player.x + 3 * CHUNK_W) > (world.built + 1) * CHUNK_W) buildChunk(world.built + 1);

  for (const c of R.coins) {
    if (c.got) continue;
    if (Math.abs(c.x - player.x) < 34 && Math.abs(c.y - R.ry) < 36) {
      c.got = true; R.got++; run.coins++; run.money += CARROT_COIN;
      S.coin();
      burst(c.x, c.y, "#ffe07a", 9, 190);
      floatText(c.x, c.y - 14, "+" + CARROT_COIN, "#fff6c2");
    }
  }

  // sparkle trail
  if (Math.random() < 0.75) {
    world.parts.push({ x: player.x - 14, y: R.ry + (Math.random() - 0.5) * 22,
      vx: -180 - Math.random() * 90, vy: (Math.random() - 0.5) * 70, life: 0, max: 0.5,
      color: ["#ff9fc4","#ffe97a","#a9edc4","#9ecdff","#c3a9ff"][(Math.random()*5)|0], size: 3.2 });
  }
  for (let i = world.parts.length - 1; i >= 0; i--) {
    const p = world.parts[i];
    p.life += dt;
    if (p.life >= p.max) { world.parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = world.texts.length - 1; i >= 0; i--) {
    const tx = world.texts[i]; tx.life += dt; tx.y -= 46 * dt;
    if (tx.life >= tx.max) world.texts.splice(i, 1);
  }

  run.camX = player.x - 300;
  syncHud();
  if (R.t >= RAINBOW_TIME) endRainbow();
}

function updatePlay(dt) {
  if (run.rainbow) { updateRainbow(dt); return; }
  pollInput();
  game.shake *= Math.pow(0.0016, dt);

  if (!run.over) {
    /* ---- horizontal movement ---- */
    let dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);

    // hold a direction and the dumpling gradually winds up to a sprint
    if (dir !== 0 && dir === player.runDir) player.runT += dt;
    else { player.runT = 0; player.runDir = dir; }
    const wind = Math.max(0, Math.min(1, (player.runT - SPRINT_AFTER) / SPRINT_RAMP));
    const speedMult = player.power === "speed" ? POWER_SPEED_MULT : 1;
    const topSpeed = (MAX_RUN + (SPRINT_RUN - MAX_RUN) * wind) * speedMult;

    /* Sliding: crouch on a slope and gravity does the rest.
       A hill is built from ramp tiles with flat filler between them, so the
       slope reading blinks to zero at every junction. Remember the last
       downhill direction for a moment so one flat tile doesn't kill the slide
       and leave you stranded halfway down. */
    if (player.slopeDir !== 0) { player.lastSlope = player.slopeDir; player.slopeGrace = 0.28; }
    else player.slopeGrace = Math.max(0, player.slopeGrace - dt);
    const onSlope = player.slopeDir !== 0 || player.slopeGrace > 0;

    const downhill = player.slopeDir !== 0 ? player.slopeDir : player.lastSlope;
    // automatic: sliding happens unless you actively press the uphill
    // direction to climb instead. Standing still on a slope slides too.
    const fightingIt = dir !== 0 && downhill !== 0 && dir === -downhill;
    player.slide = player.onGround && onSlope && !run.over && !fightingIt && downhill !== 0;
    if (player.slide) {
      player.vx += downhill * SLIDE_ACCEL * dt;
      player.vx = Math.max(-SLIDE_MAX, Math.min(SLIDE_MAX, player.vx));
      if (downhill !== 0) player.face = downhill;
      if (!player.slideSfx) { S.slide(); player.slideSfx = 0.35; }
      player.slideSfx -= dt;
      if (player.slideSfx < 0) player.slideSfx = 0;
    } else {
      const accel = player.onGround ? RUN_ACCEL : AIR_ACCEL;
      if (dir !== 0) {
        player.vx += dir * accel * dt;
        player.vx = Math.max(-topSpeed, Math.min(topSpeed, player.vx));
        player.face = dir;
      } else if (player.onGround) {
        const f = FRICTION * dt;
        player.vx = Math.abs(player.vx) <= f ? 0 : player.vx - Math.sign(player.vx) * f;
      }
    }

    /* ---- jump: coyote time + input buffering ---- */
    if (input.jumpPressed) { player.buffer = JUMP_BUFFER; input.jumpPressed = false; }
    player.buffer -= dt; player.coyote -= dt;
    const jumpMult = player.power === "jump" ? POWER_JUMP_MULT : 1;
    if (player.buffer > 0 && player.coyote > 0) {
      player.vy = -JUMP_V * jumpMult; player.buffer = 0; player.coyote = 0;
      player.onGround = false; player.squash = -0.35; S.jump();
    } else if (player.buffer > 0 && player.airJumps > 0 && !player.onGround) {
      // the double bounce -- a second, slightly smaller jump in mid-air
      player.airJumps--; player.buffer = 0;
      player.vy = -JUMP_V * DOUBLE_V * jumpMult; player.squash = -0.45;
      S.double();
      puffRing(player.x + player.w/2, player.y + player.h);
    }
    // a trampoline bounce is involuntary -- it isn't cut short by not holding jump
    if (player.vy < 0 && !input.jumpHeld && player.cloudMusic <= 0) {
      player.vy *= Math.pow(JUMP_CUT, dt * 60 / 8);
    }

    player.flying = false;
    if (player.power === "fly" && !player.onGround && input.jumpHeld && player.flyFuel > 0) {
      player.vy = Math.max(player.vy - FLY_LIFT * dt, -FLY_VMAX);
      // the camera never scrolls vertically -- keep flight on screen
      if (player.y < 24) { player.y = 24; player.vy = Math.max(player.vy, 0); }
      player.flyFuel = Math.max(0, player.flyFuel - dt);
      player.flying = true;
      if (Math.random() < 0.6) {
        world.parts.push({ x: player.x + player.w/2 - player.face * 10, y: player.y + player.h * 0.6,
          vx: -player.face * (40 + Math.random() * 50), vy: 60 + Math.random() * 50,
          life: 0, max: 0.4, color: ["#ffe8f8","#d8b8ff","#fff"][(Math.random()*3)|0], size: 3 });
      }
    }

    player.prevY = player.y;
    const power = equippedPower();
    player.power = power;
    const hit = moveBody(player, dt, power === "big" ? STEP_UP * POWER_BIG_STEP : STEP_UP);
    player.slopeDir = hit.slope || 0;
    if (hit.ceil) {
      const hy = player.y - 5;
      bumpBrick(player.x + 5, hy) || bumpBrick(player.x + player.w/2, hy) ||
        bumpBrick(player.x + player.w - 5, hy);
    }
    if (hit.ground) {
      if (!player.onGround) { player.squash = 0.45; S.land(); }
      player.onGround = true; player.coyote = COYOTE; player.combo = 0; player.airJumps = 1;
      if (player.power === "fly") player.flyFuel = FLY_TIME;
    } else {
      if (player.onGround) player.coyote = COYOTE;   // just walked off a ledge
      player.onGround = false;
    }
    if (player.x < run.wallX - 200) player.x = run.wallX - 200;
    if (player.y > H + 120) respawnFromPit();

    player.iframes = Math.max(0, player.iframes - dt);
    if (player.cloudMusic > 0) {
      player.cloudMusic -= dt;
      if (player.cloudMusic <= 0 || player.onGround) {
        player.cloudMusic = 0;
        MUSIC.setMode(player.star > 0 ? "star" : "run");
        // dynamic sky coins only exist for the length of the bounce --
        // performance: nothing lingers in world.coins once it's over
        for (let i = world.coins.length - 1; i >= 0; i--) {
          if (world.coins[i].dynamic) world.coins.splice(i, 1);
        }
      }
    }
    if (player.star > 0) {
      player.star -= dt;
      if (Math.random() < 0.55) {
        world.parts.push({ x: player.x + Math.random() * player.w, y: player.y + Math.random() * player.h,
          vx: (Math.random() - 0.5) * 90, vy: -40 - Math.random() * 90, life: 0, max: 0.45,
          color: ["#ffe97a","#fff6c2","#ffd36b","#ffffff"][(Math.random()*4)|0], size: 3 });
      }
      if (player.star <= 0) { player.star = 0; MUSIC.setMode("run"); }
    }
    player.anim += dt * (player.onGround ? Math.abs(player.vx) / 42 : 4);
    player.squash += (0 - player.squash) * Math.min(1, dt * 12);

    if (player.slide && Math.abs(player.vx) > 90 && Math.random() < 0.6) {
      world.parts.push({ x: player.x + player.w/2 - player.face * 12, y: player.y + player.h - 2,
        vx: -player.face * (60 + Math.random() * 90), vy: -30 - Math.random() * 60,
        life: 0, max: 0.35, color: "#ffffff", size: 3 });
    }
    run.maxX = Math.max(run.maxX, player.x);
    run.dist = Math.max(0, Math.floor((run.maxX - 100) / TILE));
  } else {
    run.endT += dt;
    player.vy = Math.min(player.vy + GRAVITY * dt, MAX_FALL);
    player.y += player.vy * dt;
    player.x += player.vx * dt;
  }

  /* ---- keep the course built ahead of the player ---- */
  while ((player.x + 3 * CHUNK_W) > (world.built + 1) * CHUNK_W) buildChunk(world.built + 1);

  /* ---- the squish wall ---- */
  if (!run.over) {
    let ws = Math.min(WALL_MAX, WALL_BASE + run.dist * WALL_GAIN);
    run.wallX += ws * dt;
    const lead = player.x - run.wallX;
    if (lead > WALL_LEASH) run.wallX += (lead - WALL_LEASH) * 1.7 * dt;  // no camping far ahead
    if (run.wallX + 30 > player.x + 8) { endRun("wall"); }
  }

  /* ---- enemies ---- */
  for (const e of world.enemies) {
    if (e.dead) { e.dead += dt; continue; }
    if (e.x < run.wallX - 500 || e.x > player.x + W) continue;
    e.t += dt;
    if (e.kind === "7") {
      e.hopT -= dt;
      if (e.onGround && e.hopT <= 0) { e.vy = -600; e.hopT = 1.1 + Math.random() * 0.6; e.onGround = false; }
    }
    const before = e.vx;
    const r = moveBody(e, dt);
    e.onGround = r.ground;
    if (r.wall) e.vx = -before;
    // turn around at ledges so they stay on their platform
    if (r.ground) {
      const ahead = e.x + (e.vx > 0 ? e.w + 4 : -4);
      if (!isSolidPx(ahead, e.y + e.h + 6)) e.vx = -e.vx;
    }
    if (e.vx === 0) e.vx = (Math.random() < 0.5 ? -1 : 1) * 55;

    if (run.over) continue;
    // stomp vs bump
    if (overlap(player, e)) {
      const fell = player.vy > 60 && (player.prevY + player.h) <= e.y + 14;
      if (player.star > 0 && !fell) {
        e.dead = 0.001; e.vx = 0;
        run.stomps++; run.money += 5; game.shake = 5;
        sfx(700, 0.1, "square", 0.05, 400);
        floatText(e.x + e.w/2, e.y, "+5", "#ffe97a");
        burst(e.x + e.w/2, e.y + e.h/2, "#ffe97a", 14);
      } else if (fell) {
        e.dead = 0.001; e.vx = 0;
        player.combo++;
        const pay = 5 * player.combo;
        player.vy = -STOMP_BOUNCE - Math.min(120, player.combo * 22);
        player.squash = -0.4; player.airJumps = 1;   // squashing a 6-7 refreshes it
        run.stomps++; run.money += pay; game.shake = 6;
        sfx(240 + player.combo * 60, 0.13, "sawtooth", 0.055, -140);
        floatText(e.x + e.w/2, e.y, player.combo > 1 ? "+" + pay + "  x" + player.combo + "!" : "+" + pay,
                  player.combo > 1 ? "#ff7fb0" : "#fff");
        burst(e.x + e.w/2, e.y + e.h/2, e.kind === "6" ? "#ffc7de" : "#c9d8ff", 8 + player.combo * 4);
      } else hurt();
    }
  }
  for (let i = world.enemies.length - 1; i >= 0; i--) {
    const e = world.enemies[i];
    if ((e.dead && e.dead > 0.45) || e.x < run.wallX - 700) world.enemies.splice(i, 1);
  }

  /* ---- coins, hazards, rings ---- */
  for (const c of world.coins) {
    if (c.got) continue;
    c.t += dt;
    if (run.over) continue;
    const dx = (player.x + player.w/2) - c.x, dy = (player.y + player.h/2) - c.y;
    if (dx*dx + dy*dy < 30*30) {
      c.got = true; run.coins++; run.money++; S.coin();
      burst(c.x, c.y, "#ffe07a", 7, 150);
    }
  }
  for (const hz of world.hazards) {
    hz.t += dt;
    if (run.over || player.star > 0) continue;
    if (player.x + player.w - 5 > hz.x - 15 && player.x + 5 < hz.x + 15 &&
        player.y + player.h > hz.y - 14 && player.y < hz.y + 17) hurt();
  }
  /* the things that move: droppers, rolling cheese wheels, bouncing berries */
  for (const m of world.movers) {
    if (m.x < run.wallX - 600 || m.x > player.x + W + 200) continue;
    m.t += dt;
    if (m.kind === "F") {
      if (m.state === "hang") {
        const near = Math.abs((player.x + player.w/2) - m.x) < 58 && (player.y + player.h) > m.y;
        if (near) { m.state = "fall"; m.vy = 0; }
      } else if (m.state === "fall") {
        m.vy = Math.min(1500, m.vy + 2600 * dt);
        m.y += m.vy * dt;
        if (isSolidPx(m.x, m.y + 18) || m.y > H + 60) {
          if (m.y <= H + 60) { burst(m.x, m.y + 10, "#ffd3ad", 14, 190); game.shake = 5; }
          m.state = "gone"; m.timer = 2.4;
        }
      } else {
        m.timer -= dt;
        if (m.timer <= 0) { m.state = "hang"; m.y = m.y0; m.vy = 0; }
      }
    } else if (m.kind === "X") {
      if (m.shake > 0) m.shake = Math.max(0, m.shake - dt);
    } else if (m.kind === "W") {
      if (m.state === "roll") {
        m.x += m.vx * dt; m.rot += m.vx * dt * 0.055;
        const ahead = m.x + (m.vx < 0 ? -20 : 20);
        if (isSolidPx(ahead, m.y) || !isSolidPx(ahead, m.y + 26)) {
          burst(m.x, m.y, "#f7cf6b", 12, 200);
          m.state = "gone"; m.timer = 2.2;
        }
      } else {
        m.timer -= dt;
        if (m.timer <= 0) { m.state = "roll"; m.x = m.x0; m.rot = 0; }
      }
    } else if (m.kind === "P") {
      // a wooden platform gives way under YOU -- the 6-7s can stand on it all day
      if (m.state === "solid") {
        const top = m.y - TILE/2;
        const standing = player.onGround && !run.over &&
          player.x + player.w > m.x - TILE/2 + 2 && player.x < m.x + TILE/2 - 2 &&
          Math.abs((player.y + player.h) - top) < 7;
        if (standing) { m.state = "shake"; m.timer = WOOD_SHAKE; S.creak(); }
      } else if (m.state === "shake") {
        m.timer -= dt;
        if (m.timer <= 0) {
          setTile(m.ci, m.row, m.col, ".");
          m.state = "fall"; m.timer = WOOD_BACK; m.fy = 0; m.vy = 0;
          burst(m.x, m.y, "#c9a06a", 12, 170);
        }
      } else {
        m.timer -= dt;
        m.vy += 1500 * dt; m.fy += m.vy * dt;
        if (m.timer <= 0) {
          setTile(m.ci, m.row, m.col, "=");
          m.state = "solid"; m.fy = 0; m.vy = 0;
        }
      }
    } else if (m.kind === "Z") {
      m.phase += dt * 2.5;
      m.y = m.y0 - Math.abs(Math.sin(m.phase)) * 118;
    } else if (m.kind === "T") {
      m.squish = Math.max(0, m.squish - dt * 3.2);
      if (m.spent > 0) m.spent -= dt;
      if (!run.over && m.spent <= 0 && player.vy > 60 &&
          Math.abs((player.x + player.w/2) - m.x) < 26 &&
          (player.y + player.h) > m.y - 10 && (player.y + player.h) < m.y + 18) {
        m.squish = 1; m.spent = TRAMPOLINE_COOLDOWN;
        player.vy = -TRAMPOLINE_BOUNCE;
        player.onGround = false;
        player.airJumps = 1;
        player.cloudMusic = TRAMPOLINE_MUSIC;
        game.shake = 10;
        burst(m.x, m.y - 10, "#ffffff", 18, 260);
        burst(m.x, m.y - 10, "#dff0ff", 12, 200);
        S.boing();
        MUSIC.setMode("cloud");
        // a little coin trail up into the clouds -- exists only for this
        // bounce, cleaned up when it ends (see the cloudMusic countdown)
        for (let i = 0; i < TRAMPOLINE_COINS; i++) {
          const frac = (i + 1) / (TRAMPOLINE_COINS + 1);
          world.coins.push({
            x: m.x + Math.sin(frac * Math.PI * 2.2) * 50,
            y: m.y - frac * 620 - 40,
            got: false, t: Math.random() * 6, dynamic: true
          });
        }
      }
      continue;
    }
    if (run.over || player.star > 0) continue;
    if (m.kind === "P" || m.kind === "X" || m.kind === "T") continue;  // terrain / triggers, not spikes
    const gone = (m.kind === "F" || m.kind === "W") && m.state === "gone";
    if (!gone && Math.abs((player.x + player.w/2) - m.x) < 25 &&
        Math.abs((player.y + player.h/2) - m.y) < 27) hurt();
  }

  for (const pk of world.pickups) {
    if (pk.got) continue;
    pk.t += dt;
    if (run.over) continue;
    const dx = (player.x + player.w/2) - pk.x, dy = (player.y + player.h/2) - pk.y;
    if (dx*dx + dy*dy < 34*34) {
      pk.got = true;
      if (pk.kind === "carrot") { startRainbow(pk.x, pk.y); return; }
      grabStar(pk.x, pk.y);
    }
  }
  for (const rg of world.rings) {
    rg.a += dt * 2.2;
    rg.y = rg.base + Math.sin(rg.a * 0.8) * 34;
    if (run.over || player.star > 0) continue;
    const dx = (player.x + player.w/2) - rg.x, dy = (player.y + player.h/2) - rg.y;
    if (dx*dx + dy*dy < 30*30) hurt();
  }

  /* ---- particles ---- */
  for (let i = world.parts.length - 1; i >= 0; i--) {
    const p = world.parts[i];
    p.life += dt;
    if (p.life >= p.max) { world.parts.splice(i, 1); continue; }
    p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98;
  }

  for (let i = world.texts.length - 1; i >= 0; i--) {
    const tx = world.texts[i];
    tx.life += dt; tx.y -= 46 * dt;
    if (tx.life >= tx.max) world.texts.splice(i, 1);
  }

  /* ---- camera + companion trail ---- */
  const target = Math.max(player.x - 340, run.wallX - 40);
  run.camX += (target - run.camX) * Math.min(1, dt * 6);
  run.camX = Math.max(run.camX, run.wallX - 60);
  const targetCamY = Math.max(0, CAM_Y_LINE - player.y);
  run.camY += (targetCamY - run.camY) * Math.min(1, dt * 5);
  trail.unshift({ x: player.x, y: player.y });
  if (trail.length > 26) trail.pop();

  syncHud();
  if (run.over && run.endT > 1.1) showGameOver();
}

const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

const POWER_ICON = { speed:"👟", jump:"🌻", big:"🧀", fly:"🎀" };
function syncHud() {
  const h = Math.max(0, player.hearts);
  document.getElementById("hearts").textContent =
    (player.star > 0 ? "⭐ " : "") + "💗".repeat(h) + "🤍".repeat(Math.max(0, 3 - h));
  document.getElementById("hudMoney").textContent = run.money;
  document.getElementById("hudDist").textContent = run.dist;
  const pill = document.getElementById("powerPill");
  if (player.power) {
    pill.style.display = "flex";
    document.getElementById("powerIcon").textContent = POWER_ICON[player.power] || "✨";
    document.getElementById("powerLabel").textContent =
      player.power === "fly" ? "Fly " + Math.ceil(player.flyFuel) + "s" : "";
  } else pill.style.display = "none";
}

/* ==========================================================================
   DRAWING  -- everything is drawn in code, there are no image files
   ========================================================================== */
const cvs = document.getElementById("game");
const ctx = cvs.getContext("2d");
function fitCanvas() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cvs.width = W * dpr; cvs.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
}
addEventListener("resize", fitCanvas); fitCanvas();

if (!ctx.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    this.beginPath();
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r); this.closePath();
    return this;
  };
}
const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
function eyes(cx, cy, s, look = 0, blink = false, ink = "#4a3f55") {
  ctx.fillStyle = ink;
  const ex = s * 0.34, ey = s * 0.05;
  for (const sx of [-1, 1]) {
    if (blink) { ctx.fillRect(cx + sx*ex - s*0.13, cy + ey, s*0.26, s*0.07); continue; }
    ctx.beginPath(); ctx.ellipse(cx + sx*ex + look*s*0.06, cy + ey, s*0.115, s*0.15, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(cx + sx*ex + look*s*0.06 + s*0.04, cy + ey - s*0.05, s*0.045, 0, 7); ctx.fill();
    ctx.fillStyle = ink;
  }
}
function blush(cx, cy, s, color = "rgba(255,150,180,.5)") {
  ctx.fillStyle = color;
  for (const sx of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(cx + sx*s*0.56, cy + s*0.26, s*0.15, s*0.1, 0, 0, 7); ctx.fill();
  }
}

/* ------------------------------ background ------------------------------ */
const CLOUDS = Array.from({ length: 9 }, (_, i) => ({
  x: i * 340 + Math.random() * 160, y: 40 + Math.random() * 170, s: 0.6 + Math.random() * 0.9
}));
function drawSky(camX, t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0,   "#bcdcff"); g.addColorStop(0.42, "#ddd9fb");
  g.addColorStop(0.72,"#f7dcec"); g.addColorStop(1,    "#fbe7d6");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // sun
  ctx.fillStyle = "rgba(255,246,214,.85)";
  ctx.beginPath(); ctx.arc(W - 140, 96, 52, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.5)";
  ctx.beginPath(); ctx.arc(W - 140, 96, 74, 0, 7); ctx.fill();

  // clouds
  for (const c of CLOUDS) {
    const x = mod(c.x - camX * 0.12 + Math.sin(t * 0.1 + c.s) * 8, W + 400) - 200;
    puff(x, c.y, 46 * c.s, "rgba(255,255,255,.82)");
  }
  // far hills
  hills(camX * 0.18, 400, 84, "#c3d8f2", 0.0042);
  hills(camX * 0.32, 448, 62, "#c8e4d3", 0.0061);
  // giant blurry dumplings drifting behind the course
  for (let i = 0; i < 10; i++) {
    const bx = mod(i * 420 - camX * 0.42, W + 900) - 450;
    ctx.globalAlpha = 0.3; ctx.fillStyle = "#f6c9dd";
    ctx.beginPath(); ctx.ellipse(bx, 424, 62, 46, 0, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // hedge line, mostly tucked behind the ground so it only peeks over the top
  for (let i = 0; i < 20; i++) {
    const bx = mod(i * 210 - camX * 0.62, W + 430) - 215;
    ctx.globalAlpha = 0.85;
    puff(bx, 524, 58, "#9fd9bb");
    ctx.globalAlpha = 1;
  }
}
const mod = (v, m) => ((v % m) + m) % m;
function puff(x, y, s, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, s, s * 0.62, 0, 0, 7);
  ctx.ellipse(x - s * 0.7, y + s * 0.16, s * 0.6, s * 0.44, 0, 0, 7);
  ctx.ellipse(x + s * 0.72, y + s * 0.18, s * 0.55, s * 0.4, 0, 0, 7);
  ctx.fill();
}
function hills(off, baseY, amp, color, freq) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 12) {
    const wx = x + off;
    ctx.lineTo(x, baseY - Math.sin(wx * freq) * amp - Math.sin(wx * freq * 2.7) * amp * 0.32);
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}

/* -------------------------------- terrain ------------------------------- */
function drawTiles(camX) {
  const c0 = Math.floor(camX / TILE) - 1, c1 = Math.ceil((camX + W) / TILE) + 1;
  for (let col = c0; col <= c1; col++) {
    for (let row = 0; row < ROWS; row++) {
      const px = col * TILE, py = row * TILE;
      const ch = tileAtPx(px + 2, py + 2);
      if ("#C=><X".indexOf(ch) < 0) continue;
      // a tile is only "open" (and gets the bright top cap) when nothing sits on
      // it -- a ramp counts as sitting on it, otherwise hills look like stairs
      const above = tileAtPx(px + 2, py - 4);
      const x = px - camX, open = !isSolidPx(px + 2, py - 4) && above !== ">" && above !== "<";
      if (ch === ">" || ch === "<") {
        // a 45-degree ramp
        ctx.fillStyle = "#63c79c";
        ctx.beginPath();
        if (ch === ">") { ctx.moveTo(x, py + TILE + 1); ctx.lineTo(x + TILE, py); ctx.lineTo(x + TILE, py + TILE + 1); }
        else            { ctx.moveTo(x, py); ctx.lineTo(x + TILE, py + TILE + 1); ctx.lineTo(x, py + TILE + 1); }
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = "#a9ecca"; ctx.lineWidth = 7; ctx.lineCap = "round";
        ctx.beginPath();
        if (ch === ">") { ctx.moveTo(x + 2, py + TILE - 1); ctx.lineTo(x + TILE - 2, py + 3); }
        else            { ctx.moveTo(x + 2, py + 3); ctx.lineTo(x + TILE - 2, py + TILE - 1); }
        ctx.stroke();
        continue;
      }
      if (ch === "X") {
        const m = world.movers.find(v => v.kind === "X" && Math.abs(v.x - (px + TILE/2)) < 2 &&
                                         Math.abs(v.y - (py + TILE/2)) < 2);
        const jolt = (m && m.shake > 0) ? Math.sin(game.t * 70) * 3 * (m.shake / 0.2) : 0;
        drawBrick(x, py + jolt, m ? m.hits : 0);
        continue;
      }
      if (ch === "=") {
        const m = world.movers.find(v => v.kind === "P" && Math.abs(v.x - (px + TILE/2)) < 2 &&
                                          Math.abs(v.y - (py + TILE/2)) < 2);
        const wob = (m && m.state === "shake") ? Math.sin(game.t * 55) * 3 : 0;
        drawPlank(x + wob, py);
        continue;
      }
      if (ch === "C") {
        ctx.fillStyle = "#efb93f"; rr(x, py, TILE, TILE, 8); ctx.fill();
        ctx.fillStyle = "#ffd76b"; rr(x + 2, py + 2, TILE - 4, TILE * 0.42, 7); ctx.fill();
        ctx.fillStyle = "rgba(214,161,54,.55)";
        for (const [hx, hy, hr] of [[13, 15, 5], [30, 26, 6.5], [21, 36, 3.5]]) {
          ctx.beginPath(); ctx.arc(x + hx, py + hy, hr, 0, 7); ctx.fill();
        }
      } else {
        ctx.fillStyle = "#63c79c"; rr(x, py, TILE, TILE + 1, open ? 9 : 2); ctx.fill();
        // only shade the underside of a surface tile -- shading buried tiles
        // turns a hillside into stripes
        if (open) { ctx.fillStyle = "#49ac83"; ctx.fillRect(x, py + TILE * 0.55, TILE, TILE * 0.45); }
        if (open) {
          ctx.fillStyle = "#a9ecca"; rr(x, py, TILE, 12, 8); ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,.55)";
          ctx.beginPath(); ctx.ellipse(x + 12, py + 5, 7, 2.6, 0, 0, 7); ctx.fill();
        }
      }
    }
  }
}

/* A brick block. It picks up more cracks with every whack until it bursts. */
function drawBrick(x, y, hits) {
  ctx.fillStyle = "#b9773f"; rr(x, y, TILE, TILE, 5); ctx.fill();
  ctx.fillStyle = "#d1904f";
  const bh = TILE / 3;
  for (let r = 0; r < 3; r++) {
    const off = r % 2 ? TILE / 4 : 0;
    for (let c = -1; c < 3; c++) {
      const bx = x + off + c * (TILE / 2), bw = TILE / 2 - 3;
      const cx0 = Math.max(x + 1.5, bx), cx1 = Math.min(x + TILE - 1.5, bx + bw);
      if (cx1 > cx0) { ctx.fillRect(cx0, y + r * bh + 1.5, cx1 - cx0, bh - 3); }
    }
  }
  ctx.fillStyle = "rgba(255,255,255,.3)"; ctx.fillRect(x + 2, y + 2, TILE - 4, 3);
  if (hits > 0) {
    ctx.strokeStyle = "rgba(60,34,14,.75)"; ctx.lineWidth = 2; ctx.lineCap = "round";
    const cracks = [
      [[0.5, 0.0], [0.42, 0.35], [0.6, 0.6], [0.5, 1.0]],
      [[0.0, 0.45], [0.3, 0.5], [0.45, 0.3]],
      [[1.0, 0.35], [0.7, 0.55], [0.62, 0.85]]
    ];
    for (let i = 0; i < Math.min(hits, cracks.length); i++) {
      ctx.beginPath();
      cracks[i].forEach((pt, j) => {
        const px2 = x + pt[0] * TILE, py2 = y + pt[1] * TILE;
        j ? ctx.lineTo(px2, py2) : ctx.moveTo(px2, py2);
      });
      ctx.stroke();
    }
  }
}

function drawPlank(x, y) {
  ctx.fillStyle = "#a9793f"; rr(x, y, TILE, TILE * 0.62, 5); ctx.fill();
  ctx.fillStyle = "#c99a5c"; rr(x + 1, y + 1, TILE - 2, TILE * 0.34, 4); ctx.fill();
  ctx.strokeStyle = "rgba(110,74,36,.55)"; ctx.lineWidth = 1.6;
  for (let i = 1; i < 3; i++) {
