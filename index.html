    ctx.beginPath(); ctx.moveTo(x + i * TILE/3, y + 3); ctx.lineTo(x + i * TILE/3, y + TILE * 0.55); ctx.stroke();
  }
  ctx.fillStyle = "rgba(90,60,30,.5)";
  ctx.beginPath(); ctx.arc(x + 7, y + 8, 1.8, 0, 7); ctx.arc(x + TILE - 7, y + 8, 1.8, 0, 7); ctx.fill();
}

/* ------------------------------ collectibles ---------------------------- */
function drawCoins(camX, t) {
  for (const c of world.coins) {
    if (c.got || c.x < camX - 60 || c.x > camX + W + 60) continue;
    const x = c.x - camX, y = c.y + Math.sin(t * 2.4 + c.t) * 4;
    const sw = Math.abs(Math.cos(t * 2.6 + c.t));
    ctx.save(); ctx.translate(x, y); ctx.scale(0.35 + sw * 0.65, 1);
    ctx.fillStyle = "#f2c23e"; ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.fill();
    ctx.fillStyle = "#ffe07a"; ctx.beginPath(); ctx.arc(0, 0, 10, 0, 7); ctx.fill();
    ctx.fillStyle = "#f2c23e"; ctx.font = "bold 13px ui-rounded,system-ui,sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("D", 0, 1);
    ctx.restore();
  }
}
function drawHazard(hz, camX, t) {
  const x = hz.x - camX, y = hz.y, b = Math.sin(t * 3 + hz.t) * 2;
  ctx.fillStyle = "rgba(60,45,75,.14)";
  ctx.beginPath(); ctx.ellipse(x, y + 18, 15, 4, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(x, y + b);
  switch (hz.kind) {
    case "D": // angry dumpling
      ctx.fillStyle = "#ffe9d2"; rr(-17, -14, 34, 28, 13); ctx.fill();
      ctx.fillStyle = "#ffd3ad";
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.arc(i * 7, -13, 5, Math.PI, 0); ctx.fill(); }
      ctx.strokeStyle = "#c9927a"; ctx.lineWidth = 2.4; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-11, -5); ctx.lineTo(-4, -2); ctx.moveTo(11, -5); ctx.lineTo(4, -2); ctx.stroke();
      eyes(0, 2, 20, 0, false, "#7a5c4e"); break;
    case "S": // strawberry
      ctx.fillStyle = "#ff8fa8"; ctx.beginPath();
      ctx.moveTo(0, 16); ctx.quadraticCurveTo(-18, 2, -13, -8);
      ctx.quadraticCurveTo(-6, -16, 0, -10); ctx.quadraticCurveTo(6, -16, 13, -8);
      ctx.quadraticCurveTo(18, 2, 0, 16); ctx.fill();
      ctx.fillStyle = "#fff0f3";
      for (const [sx, sy] of [[-6,0],[5,-2],[0,7],[-2,-6],[8,6]]) { ctx.beginPath(); ctx.ellipse(sx, sy, 1.6, 2.4, 0, 0, 7); ctx.fill(); }
      ctx.fillStyle = "#7fd6a0"; rr(-9, -16, 18, 7, 3.5); ctx.fill(); break;
    case "P": // paw
      ctx.fillStyle = "#f7a8c6"; ctx.beginPath(); ctx.ellipse(0, 5, 15, 12, 0, 0, 7); ctx.fill();
      for (const [px, py, pr] of [[-11,-8,5],[-4,-12,5.2],[4,-12,5.2],[11,-8,5]]) {
        ctx.beginPath(); ctx.arc(px, py, pr, 0, 7); ctx.fill();
      }
      ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.beginPath(); ctx.ellipse(-4, 2, 5, 4, 0, 0, 7); ctx.fill(); break;
    case "N": // banana
      ctx.fillStyle = "#f7d95c"; ctx.beginPath();
      ctx.moveTo(-16, -6); ctx.quadraticCurveTo(0, 20, 16, -6);
      ctx.quadraticCurveTo(2, 9, -16, -6); ctx.fill();
      ctx.fillStyle = "#c9a92e"; ctx.beginPath(); ctx.arc(-16, -6, 3, 0, 7); ctx.fill(); break;
    case "B": // butter
      ctx.fillStyle = "#f0d268"; rr(-17, -12, 34, 24, 5); ctx.fill();
      ctx.fillStyle = "#fff0a8"; rr(-17, -12, 34, 9, 4); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.6)"; rr(-12, -8, 12, 4, 2); ctx.fill(); break;
  }
  ctx.restore();
}
function drawStar(pk, camX, t) {
  const x = pk.x - camX, y = pk.y + Math.sin(t * 2.4 + pk.t) * 7;
  const pulse = 0.72 + Math.sin(t * 6 + pk.t) * 0.28;
  const g = ctx.createRadialGradient(x, y, 3, x, y, 50 * pulse);
  g.addColorStop(0, "rgba(255,255,220,.95)");
  g.addColorStop(0.4, "rgba(255,220,110,.42)");
  g.addColorStop(1, "rgba(255,220,110,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 50 * pulse, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * 1.4 + pk.t) * 0.3);
  const sg = ctx.createLinearGradient(0, -20, 0, 20);
  sg.addColorStop(0, "#fff6b0"); sg.addColorStop(1, "#ffbe2e");
  ctx.fillStyle = sg; ctx.strokeStyle = "#f0a010"; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5, r = i % 2 ? 8.5 : 20;
    i ? ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r) : ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  eyes(0, 1, 20, 0, Math.sin(t * 2.2 + pk.t) > 0.92, "#8a5a10");
  ctx.restore();
}

function drawMover(m, camX, t) {
  const x = m.x - camX, gone = (m.kind === "F" || m.kind === "W") && m.state === "gone";
  if (gone) return;
  if (m.kind === "X") return;   // bricks are drawn as terrain, in drawTiles
  if (m.kind === "P") {
    // only draw the plank here once it has broken away and is tumbling
    if (m.state === "fall" && m.fy < H) {
      ctx.save(); ctx.translate(x, m.y - TILE/2 + m.fy); ctx.rotate(m.fy * 0.004);
      ctx.globalAlpha = Math.max(0, 1 - m.fy / 420);
      drawPlank(-TILE/2, 0);
      ctx.restore(); ctx.globalAlpha = 1;
    }
    return;
  }
  if (m.kind === "F") {
    // a dumpling hanging in the air, wobbling harder the closer it is to dropping
    const shake = m.state === "hang" ? 0 : Math.sin(t * 40) * 2;
    ctx.fillStyle = "rgba(60,45,75,.13)";
    ctx.beginPath(); ctx.ellipse(x, (ROWS-1)*TILE - 4, 16, 4, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(x + shake, m.y);
    ctx.fillStyle = "#ffe0c4"; rr(-18, -15, 36, 30, 14); ctx.fill();
    ctx.fillStyle = "#ffc9a0";
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.arc(i * 7.5, -14, 5.2, Math.PI, 0); ctx.fill(); }
    ctx.strokeStyle = "#b8806a"; ctx.lineWidth = 2.6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-11, -6); ctx.lineTo(-4, -3); ctx.moveTo(11, -6); ctx.lineTo(4, -3); ctx.stroke();
    eyes(0, 3, 21, 0, false, "#7a5c4e");
    ctx.restore();
  } else if (m.kind === "W") {
    ctx.save(); ctx.translate(x, m.y); ctx.rotate(m.rot);
    ctx.fillStyle = "#efb93f"; ctx.beginPath(); ctx.arc(0, 0, 19, 0, 7); ctx.fill();
    ctx.fillStyle = "#ffd76b"; ctx.beginPath(); ctx.arc(0, 0, 15, 0, 7); ctx.fill();
    ctx.fillStyle = "#d6a136";
    for (const [hx, hy, hr] of [[-6, -3, 3.6], [5, 4, 4.4], [3, -7, 2.6]]) {
      ctx.beginPath(); ctx.arc(hx, hy, hr, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = "#c98f28"; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(0, 0, 19, 0, 7); ctx.stroke();
    ctx.restore();
  } else if (m.kind === "T") {
    const squish = m.squish;
    ctx.fillStyle = "rgba(60,45,75,.14)";
    ctx.beginPath(); ctx.ellipse(x, m.y + 20, 24, 5, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(x, m.y);
    ctx.scale(1 + squish * 0.28, 1 - squish * 0.4);
    ctx.strokeStyle = "#e0a84f"; ctx.lineWidth = 3;
    for (const sx of [-19, -9, 0, 9, 19]) { ctx.beginPath(); ctx.moveTo(sx, 6); ctx.lineTo(sx * 0.7, 16); ctx.stroke(); }
    const tg = ctx.createRadialGradient(0, -4, 2, 0, 0, 26);
    tg.addColorStop(0, "#bfe9ff"); tg.addColorStop(1, "#8fcdf0");
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.ellipse(0, 0, 24, 12, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = "#e0a84f"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(0, 0, 24, 12, 0, 0, 7); ctx.stroke();
    eyes(0, -1, 20, 0, Math.sin(t * 1.8 + m.t) > 0.94, "#3a6a8a");
    blush(0, -1, 12, "rgba(255,160,190,.4)");
    ctx.restore();
  } else if (m.kind === "Z") {
    // bouncing strawberry
    const squash = Math.abs(Math.sin(m.phase)) < 0.12 ? 0.28 : 0;
    ctx.fillStyle = "rgba(60,45,75,.13)";
    ctx.beginPath(); ctx.ellipse(x, m.y0 + 15, 14 - squash * 10, 4, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(x, m.y); ctx.scale(1 + squash, 1 - squash);
    ctx.fillStyle = "#ff8fa8"; ctx.beginPath();
    ctx.moveTo(0, 16); ctx.quadraticCurveTo(-18, 2, -13, -8);
    ctx.quadraticCurveTo(-6, -16, 0, -10); ctx.quadraticCurveTo(6, -16, 13, -8);
    ctx.quadraticCurveTo(18, 2, 0, 16); ctx.fill();
    ctx.fillStyle = "#fff0f3";
    for (const [sx, sy] of [[-6,0],[5,-2],[0,7],[-2,-6],[8,6]]) { ctx.beginPath(); ctx.ellipse(sx, sy, 1.6, 2.4, 0, 0, 7); ctx.fill(); }
    ctx.fillStyle = "#7fd6a0"; rr(-9, -16, 18, 7, 3.5); ctx.fill();
    eyes(0, 2, 17, 0, false, "#a33b58");
    ctx.restore();
  }
}

function drawCarrot(ct, camX, t) {
  if (ct.got) return;
  const x = ct.x - camX, y = ct.y + Math.sin(t * 2 + ct.t) * 6;
  const pulse = 0.72 + Math.sin(t * 4.5 + ct.t) * 0.28;

  // the glow
  const g = ctx.createRadialGradient(x, y, 4, x, y, 52 * pulse);
  g.addColorStop(0,   "rgba(255,224,150,.95)");
  g.addColorStop(0.35,"rgba(255,180,90,.45)");
  g.addColorStop(1,   "rgba(255,170,90,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, 52 * pulse, 0, 7); ctx.fill();

  // orbiting sparkles
  ctx.fillStyle = "rgba(255,255,255,.9)";
  for (let i = 0; i < 5; i++) {
    const a = t * 2.2 + i * 1.257, r = 27 + Math.sin(t * 3 + i) * 5;
    ctx.beginPath(); ctx.arc(x + Math.cos(a) * r, y + Math.sin(a) * r * 0.75, 2.2, 0, 7); ctx.fill();
  }

  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * 1.6 + ct.t) * 0.16);
  // leafy top
  ctx.fillStyle = "#6fc95f";
  for (const [lx, ly, rot] of [[-7, -20, -0.6], [0, -24, 0], [7, -20, 0.6]]) {
    ctx.save(); ctx.translate(lx, ly); ctx.rotate(rot);
    ctx.beginPath(); ctx.ellipse(0, 0, 4.5, 10, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
  // body
  const bg = ctx.createLinearGradient(-9, -14, 9, 18);
  bg.addColorStop(0, "#ffc46b"); bg.addColorStop(0.5, "#ff9838"); bg.addColorStop(1, "#f07c20");
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(-10, -13); ctx.quadraticCurveTo(0, -18, 10, -13);
  ctx.quadraticCurveTo(6, 6, 0, 20); ctx.quadraticCurveTo(-6, 6, -10, -13);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 1.6;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(-7 + i * 5, -8 + i * 5); ctx.lineTo(-2 + i * 5, -6 + i * 5); ctx.stroke();
  }
  ctx.fillStyle = "rgba(255,255,255,.6)";
  ctx.beginPath(); ctx.ellipse(-4, -7, 2.2, 4.5, -0.3, 0, 7); ctx.fill();
  ctx.restore();
}

function drawRing(rg, camX) {
  const x = rg.x - camX;
  ctx.save(); ctx.translate(x, rg.y); ctx.rotate(rg.a);
  const cols = ["#ffb3c6", "#ffd98a", "#a8e6c8", "#a8c8f0", "#d0b0f0", "#ffc0e0"];
  ctx.lineWidth = 8; ctx.lineCap = "butt";
  for (let i = 0; i < cols.length; i++) {
    ctx.strokeStyle = cols[i]; ctx.beginPath();
    ctx.arc(0, 0, 17, i * 1.047, (i + 1) * 1.047 + 0.03); ctx.stroke();
  }
  ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, 0, 21.5, -0.9, 0.2); ctx.stroke();
  ctx.restore();
}

/* -------------------------------- enemies -------------------------------- */
function drawEnemy(e, camX, t) {
  const x = e.x + e.w/2 - camX, y = e.y + e.h/2;
  const squash = e.dead ? Math.min(1, e.dead * 7) : 0;
  const w = e.w/2 * (1 + squash * 0.55), h = e.h/2 * (1 - squash * 0.78);
  const wob = e.dead ? 0 : Math.sin(e.t * 7) * 0.06;
  ctx.save(); ctx.translate(x, y + squash * e.h * 0.4);
  const body = e.kind === "6" ? "#ff9fc4" : "#9fc0f0";
  const dark = e.kind === "6" ? "#e87ba7" : "#7ea3d8";
  ctx.fillStyle = dark; ctx.beginPath(); ctx.ellipse(0, 4, w * (1 + wob), h * (1 - wob), 0, 0, 7); ctx.fill();
  ctx.fillStyle = body; ctx.strokeStyle = "rgba(88,66,104,.42)"; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.ellipse(0, 1, w * (1 + wob), h * (1 - wob), 0, 0, 7); ctx.fill(); ctx.stroke();
  if (!e.dead) {
    // little feet
    ctx.fillStyle = dark;
    const sw = Math.sin(e.t * 9) * 4;
    ctx.beginPath(); ctx.ellipse(-7, h - 2, 5, 3.4, 0, 0, 7); ctx.ellipse(7, h - 2 + sw * 0.2, 5, 3.4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.font = "900 20px ui-rounded,system-ui,sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(e.kind, 0, 7);
    eyes(0, -5, 21, e.vx > 0 ? 1 : -1, (Math.sin(e.t * 1.7) > 0.94));
    blush(0, -5, 12, "rgba(255,255,255,.45)");
  } else {
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.6; ctx.lineCap = "round";
    for (const sx of [-7, 7]) {
      ctx.beginPath(); ctx.moveTo(sx - 4, -3); ctx.lineTo(sx + 4, 3);
      ctx.moveTo(sx + 4, -3); ctx.lineTo(sx - 4, 3); ctx.stroke();
    }
  }
  ctx.restore();
}

/* --------------------------- the hero dumpling --------------------------- */
/* ============================== SKINS ==================================
   Two independent equip slots: a body-colour skin, and a small accessory.
   Neither touches the superpower equip slot (Collection screen) -- you can
   be flying-powered while wearing any skin you like.
   ========================================================================== */
const CLASSIC_PALETTE = [[0.00,"#ffadd2"],[0.24,"#ffd390"],[0.48,"#a9edc4"],[0.74,"#9ecdff"],[1.00,"#c3a9ff"]];

// always-available presets, unlocked from the very first launch
const PALETTES = [
  { id:"classic",   name:"Classic Rainbow", stops: CLASSIC_PALETTE },
  { id:"sunset",     name:"Sunset",   stops: [[0,"#ff9a6b"],[0.35,"#ff6f91"],[0.7,"#c86bd8"],[1,"#7a5cff"]] },
  { id:"mint",       name:"Mint Breeze", stops: [[0,"#bdf2d6"],[0.4,"#8fe3c9"],[0.75,"#7fd0e8"],[1,"#a9c8f0"]] },
  { id:"bubblegum",  name:"Bubblegum", stops: [[0,"#ffd6ec"],[0.4,"#ff9fd0"],[0.75,"#ff7ab8"],[1,"#f0a8ff"]] },
  { id:"lemonade",   name:"Lemonade", stops: [[0,"#fff6c2"],[0.4,"#ffe27a"],[0.75,"#ffcf6b"],[1,"#ffe8a3"]] },
  { id:"galaxy",     name:"Galaxy Night", stops: [[0,"#6b5aa6"],[0.35,"#4b3b8f"],[0.7,"#2f2560"],[1,"#8f7ad6"]] }
];

// unlocked by general progress, not tied to any one squishy
const ACCESSORIES = [
  { id:"partyhat", name:"Party Hat", icon:"🎉", need: s => s.bestDist >= 200,
    hint:"reach 200m in a single run" },
  { id:"bandana",  name:"Bandana",   icon:"🧣", need: s => s.runs >= 5,
    hint:"finish 5 runs" },
  { id:"bowtie",   name:"Bow Tie",   icon:"🎀", need: s => distinctOwned() >= 5,
    hint:"collect 5 different squishies" },
  { id:"shades",   name:"Sunglasses", icon:"🕶️", need: s => s.bestDist >= 600,
    hint:"reach 600m in a single run" }
];

function accessoryUnlocked(acc) { return acc.need(save); }

// every owned squishy unlocks a recolor built from its own two colours
function squishyPalette(def) {
  if (def.rainbow) return CLASSIC_PALETTE.map(([p, c], i) =>
    [p, i % 2 ? def.c2 : def.c1]);
  return [[0, def.c1], [0.55, def.c2], [1, def.c1]];
}

function currentPalette() {
  const preset = PALETTES.find(p => p.id === save.skin);
  if (preset) return preset.stops;
  const sq = byId(save.skin);
  if (sq && owned(sq.id)) return squishyPalette(sq);
  return CLASSIC_PALETTE;
}

function drawAccessory(id, w, h, scale) {
  ctx.save();
  if (id === "partyhat") {
    ctx.fillStyle = "#ff9fd0"; ctx.strokeStyle = "rgba(88,66,104,.5)"; ctx.lineWidth = 1.6 * scale;
    ctx.beginPath();
    ctx.moveTo(-11 * scale, -h * 0.34); ctx.lineTo(11 * scale, -h * 0.34); ctx.lineTo(0, -h * 0.74);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#ffe07a"; ctx.beginPath(); ctx.arc(0, -h * 0.74, 3.2 * scale, 0, 7); ctx.fill();
    ctx.fillStyle = "#9ecdff";
    for (const [dx, dy] of [[-6, -0.46], [2, -0.58], [-2, -0.4]]) {
      ctx.beginPath(); ctx.arc(dx * scale, dy * h, 1.8 * scale, 0, 7); ctx.fill();
    }
  } else if (id === "bandana") {
    ctx.fillStyle = "#ff7a7a"; ctx.strokeStyle = "rgba(88,66,104,.4)"; ctx.lineWidth = 1.4 * scale;
    ctx.beginPath(); ctx.ellipse(0, -h * 0.3, 15 * scale, 6 * scale, 0, 0, Math.PI, true); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.6)";
    for (const dx of [-6, 0, 6]) { ctx.beginPath(); ctx.arc(dx * scale, -h * 0.31, 1.3 * scale, 0, 7); ctx.fill(); }
  } else if (id === "bowtie") {
    ctx.fillStyle = "#ff6fa8"; ctx.strokeStyle = "rgba(88,66,104,.4)"; ctx.lineWidth = 1.4 * scale;
    ctx.beginPath();
    ctx.moveTo(-2, h * 0.16); ctx.lineTo(-11 * scale, h * 0.09); ctx.lineTo(-11 * scale, h * 0.23); ctx.closePath();
    ctx.moveTo(2, h * 0.16); ctx.lineTo(11 * scale, h * 0.09); ctx.lineTo(11 * scale, h * 0.23); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#e0498a"; ctx.beginPath(); ctx.arc(0, h * 0.16, 2.6 * scale, 0, 7); ctx.fill();
  } else if (id === "shades") {
    ctx.fillStyle = "#3a2f45"; ctx.strokeStyle = "rgba(0,0,0,.3)"; ctx.lineWidth = 1.2 * scale;
    for (const sx of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(sx * 9 * scale, -h * 0.05, 6.4 * scale, 5 * scale, 0, 0, 7); ctx.fill(); ctx.stroke();
    }
    ctx.strokeStyle = "#3a2f45"; ctx.lineWidth = 1.6 * scale;
    ctx.beginPath(); ctx.moveTo(-3 * scale, -h * 0.05); ctx.lineTo(3 * scale, -h * 0.05); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.35)";
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * 11 * scale, -h * 0.08, 2 * scale, 1.6 * scale, 0, 0, 7); ctx.fill(); }
  }
  ctx.restore();
}

function drawDumplingHero(cx, footY, scale, t, opts) {
  const o = opts || {};
  const run = o.run || 0, air = o.air || 0, sq = o.squash || 0, face = o.face || 1;
  const slide = !!o.slide;
  const w = 46 * scale * (1 - sq * 0.55), h = 46 * scale * (1 + sq * 0.55);
  const cy = footY - h * 0.5 - 6 * scale;
  const swing = Math.sin(run) * 0.9;

  ctx.fillStyle = "rgba(60,45,75,.16)";
  ctx.beginPath(); ctx.ellipse(cx, footY + 4, 20 * scale, 5 * scale, 0, 0, 7); ctx.fill();

  ctx.save(); ctx.translate(cx, cy); ctx.scale(face, 1);
  if (slide) ctx.rotate(-0.22);

  if (o.cape) {
    const flap = (air ? 0.5 : 0.15) + Math.sin(t * (o.flying ? 10 : 4)) * (o.flying ? 0.35 : 0.12);
    const cg = ctx.createLinearGradient(-w * 0.1, -h * 0.1, -w * 0.1, h * 0.5);
    cg.addColorStop(0, "#ffb3e0"); cg.addColorStop(1, "#c79bff");
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.moveTo(-w * 0.28, -h * 0.28);
    ctx.quadraticCurveTo(-w * (0.55 + flap * 0.3), h * 0.05, -w * (0.4 + flap * 0.4), h * 0.5);
    ctx.quadraticCurveTo(-w * 0.15, h * 0.32, -w * 0.05, -h * 0.1);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(120,70,140,.35)"; ctx.lineWidth = 1.4 * scale; ctx.stroke();
  }

  // legs -- tucked forward when sliding
  ctx.strokeStyle = "#e8a889"; ctx.lineWidth = 6.5 * scale; ctx.lineCap = "round";
  const legY = h * 0.42, legLen = 13 * scale;
  for (const s of [-1, 1]) {
    if (slide) {
      ctx.beginPath();
      ctx.moveTo(s * 7 * scale, legY);
      ctx.lineTo(s * 7 * scale + 13 * scale, legY + 3 * scale);
      ctx.stroke();
      ctx.fillStyle = "#f8c3a4";
      ctx.beginPath();
      ctx.ellipse(s * 7 * scale + 15 * scale, legY + 4 * scale, 6 * scale, 4 * scale, 0, 0, 7);
      ctx.fill();
      continue;
    }
    const kick = air ? (s > 0 ? -0.5 : 0.35) : swing * s;
    ctx.beginPath();
    ctx.moveTo(s * 8 * scale, legY);
    ctx.lineTo(s * 8 * scale + kick * 9 * scale, legY + legLen);
    ctx.stroke();
    ctx.fillStyle = "#f8c3a4";
    ctx.beginPath();
    ctx.ellipse(s * 8 * scale + kick * 11 * scale, legY + legLen + 2 * scale, 6 * scale, 4 * scale, 0, 0, 7);
    ctx.fill();
  }
  // arms -- straight up in the air on a slide, wheee
  ctx.strokeStyle = "#e8a889"; ctx.lineWidth = 5.6 * scale;
  for (const s of [-1, 1]) {
    if (slide) {
      ctx.beginPath();
      ctx.moveTo(s * w * 0.34, -h * 0.16);
      ctx.lineTo(s * w * 0.46, -h * 0.62);
      ctx.stroke();
      ctx.fillStyle = "#f8c3a4";
      ctx.beginPath();
      ctx.arc(s * w * 0.47, -h * 0.66, 4.4 * scale, 0, 7); ctx.fill();
      continue;
    }
    const a = air ? -1.1 : -swing * s * 0.8;
    ctx.beginPath();
    ctx.moveTo(s * w * 0.42, -h * 0.02);
    ctx.lineTo(s * w * 0.42 + s * 9 * scale, -h * 0.02 + a * 8 * scale + 7 * scale);
    ctx.stroke();
  }
  // body: skinned -- opts.palette is a list of [stop, color], classic rainbow by default
  const palette = o.palette || CLASSIC_PALETTE;
  const g = ctx.createLinearGradient(-w/2, -h/2, w/2, h/2);
  for (const [stop, color] of palette) g.addColorStop(stop, color);
  ctx.fillStyle = g;
  ctx.strokeStyle = "rgba(88,66,104,.5)"; ctx.lineWidth = 2.6 * scale;
  ctx.beginPath(); ctx.ellipse(0, 0, w * 0.5, h * 0.48, 0, 0, 7); ctx.fill(); ctx.stroke();
  // pleats along the top
  ctx.fillStyle = "rgba(255,255,255,.62)";
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.ellipse(i * w * 0.19, -h * 0.4, w * 0.1, h * 0.1, 0, Math.PI, 0);
    ctx.fill();
  }
  ctx.strokeStyle = "rgba(255,255,255,.75)"; ctx.lineWidth = 1.8 * scale;
  ctx.beginPath(); ctx.ellipse(0, 0, w * 0.5 - 3, h * 0.48 - 3, 0, 0, 7); ctx.stroke();
  // shine
  ctx.fillStyle = "rgba(255,255,255,.55)";
  ctx.beginPath(); ctx.ellipse(-w * 0.18, -h * 0.2, w * 0.13, h * 0.09, -0.5, 0, 7); ctx.fill();
  // face
  eyes(0, -h * 0.04, 30 * scale, 0.6, Math.sin(t * 1.3) > 0.965);
  blush(0, -h * 0.04, 17 * scale);
  ctx.strokeStyle = "#4a3f55"; ctx.lineWidth = 2 * scale; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(2 * scale, h * 0.1, 5 * scale, 0.15, Math.PI - 0.45); ctx.stroke();
  if (o.accessory) drawAccessory(o.accessory, w, h, scale);
  ctx.restore();
}

function drawPlayer(camX, t) {
  if (player.iframes > 0 && Math.floor(player.iframes * 22) % 2 === 0) return;
  const powerScale = player.power === "big" ? POWER_BIG_SCALE : 1;
  const powerOpts = { cape: player.power === "fly", flying: player.flying,
                       palette: currentPalette(), accessory: save.accessory };
  if (player.flying) {
    // a little updraft of sparkle so flight reads even mid-frame
    ctx.save(); ctx.globalAlpha = 0.5;
    for (let i = 0; i < 3; i++) {
      const yy = player.y + player.h + 6 + i * 9 + Math.sin(t * 8 + i) * 3;
      ctx.strokeStyle = "#d8b8ff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(player.x + player.w/2 - camX - 6, yy); ctx.lineTo(player.x + player.w/2 - camX + 6, yy); ctx.stroke();
    }
    ctx.restore();
  }
  if (player.star > 0) {
    // rainbow shimmer, and it blinks faster as the star runs out
    const fading = player.star < 2 && Math.floor(player.star * 9) % 2 === 0;
    ctx.save();
    ctx.globalAlpha = fading ? 0.45 : 1;
    const glow = ctx.createRadialGradient(
      player.x + player.w/2 - camX, player.y + player.h/2, 6,
      player.x + player.w/2 - camX, player.y + player.h/2, 46);
    glow.addColorStop(0, "rgba(255,246,178,.6)"); glow.addColorStop(1, "rgba(255,246,178,0)");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(player.x + player.w/2 - camX, player.y + player.h/2, 46, 0, 7); ctx.fill();
    drawDumplingHero(player.x + player.w/2 - camX, player.y + player.h, powerScale, t, Object.assign({
      run: player.anim, air: player.onGround ? 0 : 1, squash: player.squash,
      face: player.face, slide: player.slide }, powerOpts));
    // a cycling rainbow rim rather than a wash, so the face still reads
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = fading ? 0.4 : 0.85;
    ctx.strokeStyle = RAINBOW_COLS[Math.floor(t * 14) % RAINBOW_COLS.length];
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.ellipse(player.x + player.w/2 - camX, player.y + player.h/2 - 3, 25, 26, 0, 0, 7);
    ctx.stroke();
    ctx.restore();
    return;
  }
  drawDumplingHero(player.x + player.w/2 - camX, player.y + player.h, powerScale, t, Object.assign({
    run: player.anim, air: player.onGround ? 0 : 1, squash: player.squash,
    face: player.face, slide: player.slide
  }, powerOpts));
}

/* ----------------------------- the squish wall --------------------------- */
function drawWall(camX, t) {
  const edge = run.wallX - camX;
  if (edge < -60) return;
  const g = ctx.createLinearGradient(-40, 0, edge, 0);
  g.addColorStop(0, "#c2508f"); g.addColorStop(0.6, "#ef82b6"); g.addColorStop(1, "#ffb3d4");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(-60, -20); ctx.lineTo(-60, H + 20);
  for (let y = H + 20; y >= -20; y -= 14) {
    ctx.lineTo(edge + Math.sin(y * 0.035 + t * 3.4) * 9 + Math.sin(y * 0.09 - t * 2) * 4, y);
  }
  ctx.closePath(); ctx.fill();
  // goopy highlights + bubbles
  ctx.fillStyle = "rgba(255,255,255,.35)";
  for (let i = 0; i < 12; i++) {
    const yy = mod(i * 61 - t * 46, H + 60) - 30;
    const xx = edge - 26 - Math.sin(yy * 0.05 + t) * 16;
    ctx.beginPath(); ctx.arc(xx, yy, 4 + (i % 3) * 2.5, 0, 7); ctx.fill();
  }
  // eyes so it reads as a big hungry blob
  ctx.save(); ctx.translate(edge - 46, H * 0.42 + Math.sin(t * 1.6) * 10);
  eyes(0, 0, 46, 1, Math.sin(t * 1.1) > 0.93, "#5c2448");
  ctx.restore();
  ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let y = -20; y <= H + 20; y += 14) {
    const xx = edge + Math.sin(y * 0.035 + t * 3.4) * 9 + Math.sin(y * 0.09 - t * 2) * 4;
    y === -20 ? ctx.moveTo(xx, y) : ctx.lineTo(xx, y);
  }
  ctx.stroke();
}

/* the closer the wall gets, the harder the left edge of the screen throbs */
function drawWallWarning(camX, t) {
  const gap = player.x - run.wallX;
  if (gap > 300 || run.over) return;
  const heat = Math.min(1, (300 - gap) / 260) * (0.55 + 0.45 * Math.sin(t * 11));
  const g = ctx.createLinearGradient(0, 0, W * 0.55, 0);
  g.addColorStop(0, "rgba(255,80,150," + (0.5 * heat).toFixed(3) + ")");
  g.addColorStop(1, "rgba(255,80,150,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W * 0.55, H);
}

function drawParticles(camX) {
  for (const p of world.parts) {
    const a = 1 - p.life / p.max;
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x - camX, p.y, p.size * a + 0.8, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* --------------------------- collectible squishies ----------------------- */
function drawSquishy(c, cx, cy, s, def, t) {
  c.save(); c.translate(cx, cy);
  const bob = Math.sin(t * 2 + s) * s * 0.03;
  c.translate(0, bob);
  if (def.shine) {
    const gl = c.createRadialGradient(0, 0, s * 0.4, 0, 0, s * 1.5);
    gl.addColorStop(0, "rgba(255,255,220,.55)"); gl.addColorStop(1, "rgba(255,255,220,0)");
    c.fillStyle = gl; c.beginPath(); c.arc(0, 0, s * 1.5, 0, 7); c.fill();
  }
  let fill = def.c1;
  if (def.rainbow) {
    const g = c.createLinearGradient(-s, -s, s, s);
    g.addColorStop(0, "#ffd4e6"); g.addColorStop(0.3, "#ffeec2"); g.addColorStop(0.6, "#d4f5e2");
    g.addColorStop(1, "#d6d8ff"); fill = g;
  }
  c.fillStyle = fill; c.strokeStyle = def.c2; c.lineWidth = s * 0.07;

  const P = () => { c.fill(); c.stroke(); };
  switch (def.shape) {
    case "dumpling":
      c.beginPath(); c.ellipse(0, s * 0.08, s * 0.82, s * 0.62, 0, 0, 7); P();
      c.fillStyle = def.c2;
      for (let i = -2; i <= 2; i++) { c.beginPath(); c.arc(i * s * 0.3, -s * 0.44, s * 0.15, Math.PI, 0); c.fill(); }
      break;
    case "round":
      c.beginPath(); c.arc(0, 0, s * 0.76, 0, 7); P(); break;
    case "block":
      c.beginPath(); c.roundRect(-s * 0.68, -s * 0.55, s * 1.36, s * 1.1, s * 0.18); P();
      c.fillStyle = "rgba(255,255,255,.5)";
      c.beginPath(); c.roundRect(-s * 0.5, -s * 0.4, s * 0.7, s * 0.2, s * 0.1); c.fill(); break;
    case "berry":
      c.beginPath(); c.moveTo(0, s * 0.85); c.quadraticCurveTo(-s, s * 0.05, -s * 0.7, -s * 0.42);
      c.quadraticCurveTo(-s * 0.3, -s * 0.85, 0, -s * 0.5);
      c.quadraticCurveTo(s * 0.3, -s * 0.85, s * 0.7, -s * 0.42);
      c.quadraticCurveTo(s, s * 0.05, 0, s * 0.85); P();
      c.fillStyle = "#7fd6a0"; c.beginPath(); c.roundRect(-s * 0.45, -s * 0.85, s * 0.9, s * 0.32, s * 0.14); c.fill(); break;
    case "banana":
      c.beginPath(); c.moveTo(-s * 0.85, -s * 0.35); c.quadraticCurveTo(0, s * 1.05, s * 0.85, -s * 0.35);
      c.quadraticCurveTo(s * 0.1, s * 0.45, -s * 0.85, -s * 0.35); P(); break;
    case "cheese":
      c.beginPath(); c.moveTo(-s * 0.85, s * 0.5); c.lineTo(s * 0.85, s * 0.5);
      c.lineTo(s * 0.5, -s * 0.6); c.closePath(); P();
      c.fillStyle = def.c2;
      for (const [hx, hy, hr] of [[-0.2, 0.22, 0.14], [0.35, 0.3, 0.1], [0.1, -0.1, 0.09]]) {
        c.beginPath(); c.arc(hx * s, hy * s, hr * s, 0, 7); c.fill();
      } break;
    case "paw":
      c.beginPath(); c.ellipse(0, s * 0.28, s * 0.7, s * 0.55, 0, 0, 7); P();
      for (const [px, py] of [[-0.5, -0.42], [-0.17, -0.62], [0.17, -0.62], [0.5, -0.42]]) {
        c.beginPath(); c.arc(px * s, py * s, s * 0.22, 0, 7); c.fill(); c.stroke();
      } break;
    case "cloud":
      c.beginPath(); c.ellipse(0, 0, s * 0.7, s * 0.5, 0, 0, 7);
      c.ellipse(-s * 0.55, s * 0.14, s * 0.45, s * 0.34, 0, 0, 7);
      c.ellipse(s * 0.55, s * 0.14, s * 0.42, s * 0.32, 0, 0, 7); P(); break;
    case "ring":
      c.lineWidth = s * 0.3; c.strokeStyle = def.c1;
      c.beginPath(); c.arc(0, 0, s * 0.6, 0, 7); c.stroke();
      c.strokeStyle = def.c2; c.lineWidth = s * 0.09;
      c.beginPath(); c.arc(0, 0, s * 0.76, 0, 7); c.stroke();
      c.beginPath(); c.arc(0, 0, s * 0.44, 0, 7); c.stroke(); break;
    case "star":
      c.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? s * 0.38 : s * 0.88;
        i ? c.lineTo(Math.cos(a) * r, Math.sin(a) * r) : c.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      c.closePath(); P(); break;
    case "peach":
      c.beginPath();
      c.arc(-s * 0.02, -s * 0.05, s * 0.5, 0.15, Math.PI * 2 - 0.15);
      c.closePath(); P();
      c.strokeStyle = "rgba(200,90,80,.5)"; c.lineWidth = s * 0.045; c.beginPath();
      c.moveTo(0, -s * 0.42); c.quadraticCurveTo(s * 0.06, -s * 0.02, 0, s * 0.42); c.stroke();
      c.fillStyle = "#7fae4a";
      c.beginPath(); c.ellipse(s * 0.04, -s * 0.52, s * 0.1, s * 0.2, -0.3, 0, 7); c.fill();
      break;
    case "tomato":
      c.beginPath(); c.arc(0, s * 0.06, s * 0.78, 0, 7); P();
      c.fillStyle = "#5f9c4a";
      for (let i = 0; i < 5; i++) {
        const a = -Math.PI / 2 + i * (Math.PI * 2 / 5);
        c.save(); c.translate(0, -s * 0.5); c.rotate(a);
        c.beginPath(); c.ellipse(0, 0, s * 0.09, s * 0.2, 0, 0, 7); c.fill();
        c.restore();
      }
      c.fillStyle = "rgba(255,255,255,.4)";
      c.beginPath(); c.ellipse(-s * 0.22, -s * 0.1, s * 0.16, s * 0.1, -0.4, 0, 7); c.fill();
      break;
    case "pickle":
      c.save(); c.rotate(-0.12);
      c.beginPath(); c.ellipse(0, 0, s * 0.42, s * 0.92, 0, 0, 7); P();
      c.fillStyle = def.c2;
      for (let i = -2; i <= 2; i++) { c.beginPath(); c.arc(s * 0.1 * i, i * s * 0.28, s * 0.05, 0, 7); c.fill(); }
      c.restore();
      break;
    case "sloth":
      c.beginPath(); c.arc(0, s * 0.06, s * 0.78, 0, 7); P();
      c.fillStyle = def.c2; c.globalAlpha = 0.55;
      c.beginPath(); c.ellipse(0, s * 0.18, s * 0.42, s * 0.36, 0, 0, 7); c.fill();
      c.globalAlpha = 1;
      c.fillStyle = def.c1;
      for (const sx of [-1, 1]) { c.beginPath(); c.arc(sx * s * 0.52, -s * 0.5, s * 0.18, 0, 7); c.fill(); c.stroke(); }
      break;
    case "bunny":
      c.beginPath(); c.arc(0, s * 0.14, s * 0.68, 0, 7); P();
      for (const sx of [-1, 1]) {
        c.save(); c.translate(sx * s * 0.26, -s * 0.5); c.rotate(sx * 0.14);
        c.fillStyle = def.c1; c.beginPath(); c.ellipse(0, -s * 0.32, s * 0.15, s * 0.42, 0, 0, 7); c.fill(); c.stroke();
        c.fillStyle = def.c2; c.beginPath(); c.ellipse(0, -s * 0.32, s * 0.08, s * 0.28, 0, 0, 7); c.fill();
        c.restore();
      }
      break;
    case "flower":
      c.fillStyle = def.c1;
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        c.save(); c.rotate(a);
        c.beginPath(); c.ellipse(0, -s * 0.62, s * 0.2, s * 0.32, 0, 0, 7); c.fill();
        c.restore();
      }
      c.strokeStyle = def.c1; c.lineWidth = s * 0.05;
      c.fillStyle = def.c2;
      c.beginPath(); c.arc(0, 0, s * 0.44, 0, 7); c.fill(); c.stroke();
      c.fillStyle = "rgba(0,0,0,.15)";
      for (let i = 0; i < 10; i++) {
        const a = i * 0.63, r = s * 0.14 + (i % 3) * s * 0.07;
        c.beginPath(); c.arc(Math.cos(a) * r, Math.sin(a) * r, s * 0.03, 0, 7); c.fill();
      }
      break;
    case "cheeseblock":
      c.beginPath(); c.roundRect(-s * 0.72, -s * 0.58, s * 1.44, s * 1.16, s * 0.16); P();
      c.fillStyle = def.c2;
      for (const [hx, hy, hr] of [[-0.34, -0.18, 0.15], [0.28, 0.22, 0.19], [0.05, -0.32, 0.11], [0.4, -0.15, 0.09]]) {
        c.beginPath(); c.arc(hx * s, hy * s, hr * s, 0, 7); c.fill();
      }
      c.fillStyle = "rgba(255,255,255,.5)";
      c.beginPath(); c.roundRect(-s * 0.55, -s * 0.42, s * 0.75, s * 0.2, s * 0.1); c.fill();
      break;
    case "mango":
      c.save(); c.rotate(0.18);
      c.beginPath();
      c.moveTo(0, -s * 0.85); c.quadraticCurveTo(s * 0.72, -s * 0.5, s * 0.55, s * 0.15);
      c.quadraticCurveTo(s * 0.3, s * 0.85, -s * 0.12, s * 0.7);
      c.quadraticCurveTo(-s * 0.55, s * 0.4, -s * 0.35, -s * 0.35);
      c.quadraticCurveTo(-s * 0.2, -s * 0.72, 0, -s * 0.85);
      c.closePath(); P();
      c.fillStyle = "rgba(255,255,255,.4)";
      c.beginPath(); c.ellipse(-s * 0.1, -s * 0.2, s * 0.14, s * 0.28, -0.3, 0, 7); c.fill();
      c.fillStyle = "#5f9c4a";
      c.beginPath(); c.ellipse(0, -s * 0.84, s * 0.07, s * 0.13, 0, 0, 7); c.fill();
      c.restore();
      break;
  }
  if (def.stars) {
    c.fillStyle = "rgba(255,255,255,.9)";
    for (const [sx, sy, sr] of [[-0.3, -0.1, 0.06], [0.25, 0.15, 0.05], [0.05, -0.3, 0.04], [0.4, -0.25, 0.035]]) {
      c.beginPath(); c.arc(sx * s, sy * s, sr * s, 0, 7); c.fill();
    }
  }
  // face
  const ex = s * 0.26, ey = s * (def.shape === "paw" ? 0.2 : 0.02);
  c.fillStyle = "#4a3f55";
  for (const sx of [-1, 1]) { c.beginPath(); c.ellipse(sx * ex, ey, s * 0.085, s * 0.11, 0, 0, 7); c.fill(); }
  c.fillStyle = "rgba(255,150,180,.45)";
  for (const sx of [-1, 1]) { c.beginPath(); c.ellipse(sx * s * 0.45, ey + s * 0.18, s * 0.11, s * 0.07, 0, 0, 7); c.fill(); }
  c.strokeStyle = "#4a3f55"; c.lineWidth = s * 0.05; c.lineCap = "round";
  c.beginPath(); c.arc(0, ey + s * 0.06, s * 0.11, 0.25, Math.PI - 0.25); c.stroke();
  c.restore();
}

function drawEgg(c, cx, cy, s, tier, shake, cracks) {
  const cols = [["#fff6ea", "#ffe0c2"], ["#e6f4ff", "#c2dcf5"], ["#f0e6ff", "#d4c2f5"],
                ["#ffe9f2", "#f5c2d8"], ["#fff6c2", "#f5d76e"]][Math.min(tier, 5) - 1];
  c.save(); c.translate(cx + (shake ? Math.sin(shake * 47) * 5 : 0), cy);
  c.rotate(shake ? Math.sin(shake * 33) * 0.06 : 0);
  const g = c.createLinearGradient(-s, -s, s * 0.6, s);
  g.addColorStop(0, "#ffffff"); g.addColorStop(0.45, cols[0]); g.addColorStop(1, cols[1]);
  c.fillStyle = g;
  c.beginPath(); c.ellipse(0, 0, s * 0.72, s, 0, 0, 7); c.fill();
  c.fillStyle = cols[1]; c.globalAlpha = 0.75;
  for (const [dx, dy, dr] of [[-0.3, 0.25, 0.14], [0.28, -0.1, 0.11], [0.05, 0.55, 0.1], [-0.15, -0.42, 0.09]]) {
    c.beginPath(); c.arc(dx * s, dy * s, dr * s, 0, 7); c.fill();
  }
  c.globalAlpha = 1;
  c.fillStyle = "rgba(255,255,255,.6)";
  c.beginPath(); c.ellipse(-s * 0.28, -s * 0.42, s * 0.14, s * 0.22, -0.4, 0, 7); c.fill();
  if (cracks > 0) {
    c.strokeStyle = "rgba(120,95,130,.75)"; c.lineWidth = s * 0.045; c.lineCap = "round";
    const path = [[-0.6, -0.1], [-0.3, 0.05], [-0.35, -0.2], [0, -0.05], [0.05, -0.3], [0.3, -0.1], [0.28, 0.12], [0.6, 0.02]];
    const n = Math.ceil(path.length * Math.min(1, cracks));
    c.beginPath();
    for (let i = 0; i < n; i++) { const p = path[i]; i ? c.lineTo(p[0] * s, p[1] * s) : c.moveTo(p[0] * s, p[1] * s); }
    c.stroke();
  }
  c.restore();
}

/* ==========================================================================
   SCENES
   ========================================================================== */
const RAINBOW_COLS = ["#ff8fb8", "#ffb367", "#ffe873", "#8fe6a8", "#7fc9ff", "#a98bf5", "#ef94f5"];

function renderRainbow(t) {
  const R = run.rainbow, camX = run.camX;

  // dreamy sky
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#5b3f8f"); g.addColorStop(0.35, "#a86ac4");
  g.addColorStop(0.7, "#ef8fb8"); g.addColorStop(1, "#ffd28f");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // stars
  for (let i = 0; i < 46; i++) {
    const sx = mod(i * 197 - camX * 0.08, W + 60) - 30;
    const sy = (i * 73) % (H * 0.7);
    const tw = 0.45 + Math.abs(Math.sin(t * 2 + i)) * 0.55;
    ctx.fillStyle = "rgba(255,255,255," + tw.toFixed(2) + ")";
    ctx.beginPath(); ctx.arc(sx, sy, 1.5 + (i % 3) * 0.7, 0, 7); ctx.fill();
  }
  // soft clouds drifting past
  for (let i = 0; i < 8; i++) {
    const cx2 = mod(i * 300 - camX * 0.3, W + 400) - 200;
    ctx.globalAlpha = 0.22;
    puff(cx2, 80 + (i * 91) % 340, 58, "#ffffff");
    ctx.globalAlpha = 1;
  }

  // the rainbow road itself -- coins sit on this exact curve
  ctx.lineCap = "round";
  for (let i = 0; i < RAINBOW_COLS.length; i++) {
    ctx.strokeStyle = RAINBOW_COLS[i];
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = 15;
    ctx.beginPath();
    for (let x = -30; x <= W + 30; x += 14) {
      const y = rainbowY(x + camX) + (i - 3) * 15;
      x === -30 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 0.35; ctx.lineWidth = 4; ctx.strokeStyle = "#ffffff";
  ctx.beginPath();
  for (let x = -30; x <= W + 30; x += 14) {
    const y = rainbowY(x + camX) - 50;
    x === -30 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.save();
  if (game.shake > 0.3) ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);

  drawParticles(camX);

  // coins
  for (const c of R.coins) {
    if (c.got || c.x < camX - 40 || c.x > camX + W + 40) continue;
    const x = c.x - camX, sw = Math.abs(Math.cos(t * 3 + c.x * 0.01));
    ctx.save(); ctx.translate(x, c.y); ctx.scale(0.35 + sw * 0.65, 1);
    ctx.fillStyle = "rgba(255,240,180,.45)";
    ctx.beginPath(); ctx.arc(0, 0, 19, 0, 7); ctx.fill();
    ctx.fillStyle = "#f2c23e"; ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.fill();
    ctx.fillStyle = "#ffe07a"; ctx.beginPath(); ctx.arc(0, 0, 10, 0, 7); ctx.fill();
    ctx.fillStyle = "#f2c23e"; ctx.font = "bold 13px ui-rounded,system-ui,sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("D", 0, 1);
    ctx.restore();
  }

  // the flying dumpling, tilted into the direction it's moving
  const px = player.x - camX;
  ctx.save();
  ctx.translate(px, R.ry);
  ctx.rotate(Math.max(-0.5, Math.min(0.5, R.vy / 900)));
  ctx.translate(-px, -R.ry);
  drawDumplingHero(px, R.ry + 26, 1.05, t, { run: player.anim, air: 1, squash: 0, face: 1,
    palette: currentPalette(), accessory: save.accessory });
  ctx.restore();

  if (save.equipped) {
    const def = byId(save.equipped);
    if (def) drawSquishy(ctx, px - 52, R.ry + Math.sin(t * 5) * 9, 15, def, t);
  }

  ctx.font = "900 20px ui-rounded,system-ui,sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const tx of world.texts) {
    ctx.globalAlpha = Math.max(0, 1 - tx.life / tx.max);
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(70,45,90,.6)";
    ctx.strokeText(tx.txt, tx.x - camX, tx.y);
    ctx.fillStyle = tx.color; ctx.fillText(tx.txt, tx.x - camX, tx.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // how much rainbow is left
  const frac = Math.max(0, 1 - R.t / RAINBOW_TIME);
  const bw = W * 0.46, bx = (W - bw) / 2, by = H - 34;
  ctx.fillStyle = "rgba(255,255,255,.28)"; rr(bx, by, bw, 13, 7); ctx.fill();
  const bg2 = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  RAINBOW_COLS.forEach((c, i) => bg2.addColorStop(i / (RAINBOW_COLS.length - 1), c));
  ctx.fillStyle = bg2; rr(bx, by, Math.max(4, bw * frac), 13, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.95)";
  ctx.font = "900 15px ui-rounded,system-ui,sans-serif"; ctx.textAlign = "center";
  ctx.fillText("RAINBOW RIDE!  " + R.got + " coins", W/2, by - 14);

  // a flash as you launch in
  if (R.t < 0.45) {
    ctx.fillStyle = "rgba(255,255,255," + (1 - R.t / 0.45).toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
  }
}

function renderPlay(t) {
  if (run.rainbow) { renderRainbow(t); return; }
  const camX = run.camX;
  ctx.save();
  if (game.shake > 0.3) ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
  drawSky(camX, t);

  // everything tied to the course (terrain, entities, player) pans vertically
  // during a big bounce so the ground can scroll out of view; the wall stays
  // in fixed screen space either way, so it's drawn outside this block
  ctx.save();
  if (run.camY > 0.5) ctx.translate(0, run.camY);
  drawTiles(camX);
  for (const hz of world.hazards) if (hz.x > camX - 60 && hz.x < camX + W + 60) drawHazard(hz, camX, t);
  drawCoins(camX, t);
  for (const rg of world.rings) if (rg.x > camX - 60 && rg.x < camX + W + 60) drawRing(rg, camX);
  for (const m of world.movers) if (m.x > camX - 80 && m.x < camX + W + 80) drawMover(m, camX, t);
  for (const pk of world.pickups) {
    if (pk.got || pk.x < camX - 90 || pk.x > camX + W + 90) continue;
    pk.kind === "star" ? drawStar(pk, camX, t) : drawCarrot(pk, camX, t);
  }
  for (const e of world.enemies) if (e.x > camX - 80 && e.x < camX + W + 80) drawEnemy(e, camX, t);
  drawCompanion(camX, t);
  drawPlayer(camX, t);
  drawParticles(camX);
  ctx.font = "900 20px ui-rounded,system-ui,sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const tx of world.texts) {
    ctx.globalAlpha = Math.max(0, 1 - tx.life / tx.max);
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(90,74,102,.55)";
    ctx.strokeText(tx.txt, tx.x - camX, tx.y);
    ctx.fillStyle = tx.color; ctx.fillText(tx.txt, tx.x - camX, tx.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawWall(camX, t);
  drawWallWarning(camX, t);
  ctx.restore();

  if (run.over) {
    ctx.fillStyle = "rgba(90,74,102," + Math.min(0.45, run.endT * 0.5) + ")";
    ctx.fillRect(0, 0, W, H);
  }
}

function drawCompanion(camX, t) {
  if (!save.equipped || trail.length < 20) return;
  const def = byId(save.equipped); if (!def) return;
  const p = trail[Math.min(trail.length - 1, 19)];
  drawSquishy(ctx, p.x + player.w/2 - camX, p.y + 6, 15, def, t);
}

function renderHub(t) {
  drawSky(t * 26, t);
  // a soft meadow floor
  ctx.fillStyle = "#63c79c"; ctx.fillRect(0, H - 45, W, 45);
  ctx.fillStyle = "#a9ecca"; ctx.fillRect(0, H - 45, W, 11);
  // egg on its pedestal, off to the right
  ctx.fillStyle = "rgba(90,74,102,.12)";
  ctx.beginPath(); ctx.ellipse(W - 150, H - 44, 62, 12, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#e8dcff"; rr(W - 200, H - 96, 100, 52, 16); ctx.fill();
  drawEgg(ctx, W - 150, H - 140, 52, save.eggTier, t * 0.06, 0);
  // hero idling on the left
  drawDumplingHero(126, H - 45, 1.15, t, { run: t * 1.2, air: 0, squash: Math.sin(t * 2) * 0.05, face: 1,
    palette: currentPalette(), accessory: save.accessory });
  // owned squishies float around like little balloons
  const own = SQUISHIES.filter(s => owned(s.id));
  own.slice(0, 10).forEach((s, i) => {
    const x = 60 + i * 92, y = 96 + Math.sin(t * 1.1 + i * 1.3) * 16;
    ctx.globalAlpha = 0.9; drawSquishy(ctx, x, y, 22, s, t + i); ctx.globalAlpha = 1;
  });
}

function renderHatch(t, dt) {
  const hx = game.hatch;
  drawSky(t * 20, t);
  ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fillRect(0, 0, W, H);
  hx.t += dt;
  const phase = hx.t;
  if (phase < 2.5) {
    const shake = phase > 0.6 ? phase : 0;
    drawEgg(ctx, W/2, H/2, 96, hx.tier, shake, Math.max(0, (phase - 0.9) / 1.5));
    if (phase > 0.9 && Math.random() < 0.05) S.crack();
    ctx.fillStyle = "#5a4a66"; ctx.font = "900 26px ui-rounded,system-ui,sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(EGGS[Math.min(hx.tier, 5) - 1].name + " is hatching...", W/2, H - 70);
  } else if (!hx.revealed) {
    hx.revealed = true;
    S.hatch();
    for (let i = 0; i < 46; i++) {
      const a = Math.random() * 6.28, sp = 120 + Math.random() * 320;
      world.parts.push({ x: W/2, y: H/2, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 150,
                         life: 0, max: 0.7 + Math.random()*0.6,
                         color: ["#ffd4e6","#ffe8c2","#d8f5df","#cfe4ff","#e2d4ff"][(Math.random()*5)|0],
                         size: 3 + Math.random()*4 });
    }
    grant(hx.sq);
    showMenu(menuReveal(hx.sq, hx.free));
  } else {
    drawSquishy(ctx, W/2, H/2 - 30, 78, hx.sq, t);
  }
  for (let i = world.parts.length - 1; i >= 0; i--) {
    const p = world.parts[i];
    p.life += dt;
    if (p.life >= p.max) { world.parts.splice(i, 1); continue; }
    p.vy += 620 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  drawParticles(0);
}

const menuEl = document.getElementById("menu");
const sheetEl = document.getElementById("sheet");
function showMenu(html) {
  if (html == null) { menuEl.classList.add("off"); return; }
  sheetEl.innerHTML = html;
  menuEl.classList.remove("off");
  sheetEl.scrollTop = 0;
  // paint any little squishy previews the sheet asked for
  sheetEl.querySelectorAll("canvas[data-sq]").forEach(cv => {
    const def = byId(cv.dataset.sq); if (!def) return;
    const dpr = Math.min(2, devicePixelRatio || 1);
    const size = +cv.dataset.size || 54;
    cv.width = size * dpr; cv.height = size * dpr;
    cv.style.width = size + "px"; cv.style.height = size + "px";
    const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!c.roundRect) c.roundRect = CanvasRenderingContext2D.prototype.roundRect;
    drawSquishy(c, size/2, size/2, size * 0.36, def, 0);
  });
  // and any little skin swatches -- a simple gradient blob, not the full hero rig
  sheetEl.querySelectorAll("canvas[data-preview-palette]").forEach(cv => {
    const id = cv.dataset.previewPalette;
    const preset = PALETTES.find(p => p.id === id);
    const sq = !preset && byId(id);
    const stops = preset ? preset.stops : sq ? squishyPalette(sq) : CLASSIC_PALETTE;
    const dpr = Math.min(2, devicePixelRatio || 1);
    const size = +cv.dataset.size || 54;
    cv.width = size * dpr; cv.height = size * dpr;
    cv.style.width = size + "px"; cv.style.height = size + "px";
    const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const r = size * 0.4;
    const g = c.createLinearGradient(size/2 - r, size/2 - r, size/2 + r, size/2 + r);
    for (const [stop, color] of stops) g.addColorStop(stop, color);
    c.fillStyle = g; c.strokeStyle = "rgba(88,66,104,.4)"; c.lineWidth = 1.4;
    c.beginPath(); c.ellipse(size/2, size/2, r, r * 0.92, 0, 0, 7); c.fill(); c.stroke();
    c.fillStyle = "rgba(255,255,255,.55)";
    c.beginPath(); c.ellipse(size/2 - r*0.35, size/2 - r*0.35, r*0.22, r*0.16, -0.5, 0, 7); c.fill();
  });
}

/* ------------------------- shared arena (coop), Stage 1 ------------------------- */

/* Packages one chunk's terrain + the coins/hazards/enemies/pickups/rings
   that fall within it (by world-x range, not creation order -- robust
   regardless of how/when buildChunk was called). Bricks/planks/droppers/
   rolling cheese/bouncing berries/trampolines (world.movers) are NOT
   included yet -- their solid state IS captured via the tile string itself
   (bricks/planks are `#C=><X` characters), so they render correctly as
   terrain on a guest, they just aren't independently interactive there yet. */
function coopChunkPayload(index) {
  const x0 = index * CHUNK_W, x1 = x0 + CHUNK_W;
  const inRange = e => e.x >= x0 && e.x < x1;
  return {
    index, tiles: world.tiles.get(index),
    coins: world.coins.filter(inRange).map(c => ({ _id: c._id, x: c.x, y: c.y })),
    hazards: world.hazards.filter(inRange).map(h => ({ _id: h._id, x: h.x, y: h.y, kind: h.kind })),
    enemies: world.enemies.filter(inRange).map(e => ({ _id: e._id, x: e.x, y: e.y, kind: e.kind })),
    pickups: world.pickups.filter(inRange).map(pk => ({ _id: pk._id, x: pk.x, y: pk.y, kind: pk.kind })),
    rings: world.rings.filter(inRange).map(rg => ({ _id: rg._id, x: rg.x, y: rg.y, base: rg.base })),
  };
}

function buildChunkAndBroadcast(index) {
  buildChunk(index);
  MP.broadcastCoopChunk(mp.sessionId, coopChunkPayload(index));
}

function mpStartCoopHost() {
  mp.isCoopHost = true;
  resetWorld();
  coop.players.clear();
  for (const r of mp.roster) coop.players.set(r.playerId, makePlayerEntity(r.playerId, r.nickname, {}));
  coop.tick = 0; coop.lastSnapshotT = 0; coop.camX = 0; coop.active = true;
  coop.gotCoins = []; coop.gotPickups = [];
  coop.wall = { x: -420, dist: 0, maxX: 100 };
  coop.over = false; coop.overT = 0; coop.resultsShown = false;
  game.state = "coop";
  setPlayUI(true);
  showMenu(null);
  mp.unwatchCoop = MP.watchCoop(mp.sessionId, {
    onInput: msg => {
      const p = coop.players.get(msg.playerId);
      if (p) { p.input.left = msg.left; p.input.right = msg.right; p.input.jumpHeld = msg.jumpHeld; p.jumpSeq = msg.jumpSeq; }
    },
  });
  MP.broadcastTradeEvent(mp.sessionId, "coop_start", {});
  // the initial chunks (0-3) were built by resetWorld() before the coop
  // channel existed -- send them now that guests can receive them
  for (let i = 0; i <= world.built; i++) MP.broadcastCoopChunk(mp.sessionId, coopChunkPayload(i));
}

function mpStartCoopGuest() {
  mp.isCoopHost = false;
  coop.players.clear();
  coop.lastSnapshot = null; coop.camX = 0; coop.active = true;
  coop.wall = { x: -420, dist: 0, maxX: 100 };
  coop.over = false; coop.overT = 0; coop.resultsShown = false;
  clearWorldForCoopGuest();  // clears any stale local world; chunks arrive for real via onChunk below
  game.state = "coop";
  setPlayUI(true);
  showMenu(null);
  mp.unwatchCoop = MP.watchCoop(mp.sessionId, {
    onSnapshot: snap => {
      applyCoopSnapshotToWorld(snap);
      coop.lastSnapshot = snap;
      if (snap.over && !coop.resultsShown) { coop.resultsShown = true; coopShowResults(); }
    },
    onChunk: chunk => {
      world.tiles.set(chunk.index, chunk.tiles);
      world.built = Math.max(world.built, chunk.index);
      const addIfNew = (arr, list, extra) => {
        for (const e of list) if (!arr.some(x => x._id === e._id)) arr.push(Object.assign({}, e, extra(e)));
      };
      addIfNew(world.coins, chunk.coins, () => ({ got: false, t: Math.random() * 6 }));
      addIfNew(world.hazards, chunk.hazards, () => ({ t: Math.random() * 6 }));
      addIfNew(world.enemies, chunk.enemies, () => ({ w: 34, h: 40, vx: 0, vy: 0, onGround: false, hopT: 1, dead: 0, t: 0 }));
      addIfNew(world.pickups, chunk.pickups, () => ({ got: false, t: Math.random() * 6 }));
      addIfNew(world.rings, chunk.rings, () => ({ a: Math.random() * 6.28 }));
    },
    onTile: t => setTile(t.index, t.row, t.col, t.ch),
  });
}

// guest-side: apply the host's per-tick deltas onto the locally-mirrored world
function applyCoopSnapshotToWorld(snap) {
  for (const id of snap.coinsGot || []) { const c = world.coins.find(x => x._id === id); if (c) c.got = true; }
  for (const id of snap.pickupsGot || []) { const pk = world.pickups.find(x => x._id === id); if (pk) pk.got = true; }
  for (const es of snap.enemies || []) {
    const e = world.enemies.find(x => x._id === es.id);
    if (e) { e.x = es.x; e.y = es.y; e.dead = es.dead; }
  }
  if (snap.wall) { coop.wall.x = snap.wall.x; coop.wall.dist = snap.wall.dist; }
}

/* ---- Stage 4: results screen. Reuses menuGameOver()'s stat-block pattern,
   one row per player instead of one. Each client pushes its OWN final score
   independently -- player_saves RLS only lets you update your own row, the
   host can't post scores on a guest's behalf (see multiplayer.js). ---- */
function coopShowResults() {
  const players = mp.isCoopHost ? Array.from(coop.players.values()) : (coop.lastSnapshot ? coop.lastSnapshot.players : []);
  const me = players.find(p => p.id === mp.playerId);
  if (me) {
    const dist = Math.max(0, Math.floor(((me.maxX || 100) - 100) / TILE));
    save.bestDist = Math.max(save.bestDist, dist);
    save.bestMoney = Math.max(save.bestMoney, me.money || 0);
    save.money += me.money || 0; save.runs++;
    persist();
    if (save.cloudPlayerId) {
      if (window.MP && MP.available()) {
        MP.updateSave({ best_dist: save.bestDist, best_money: save.bestMoney, money: save.money, runs: save.runs })
          .then(() => { mp.syncNotice = null; })
          .catch(err => {
            if (err && err.code === "not_registered") {
              save.cloudPlayerId = null; save.cloudNickname = null; persist();
              mp.playerId = null; mp.nickname = null;
              mp.syncNotice = "⚠️ You got signed out — tap Sign Up on the hub to log back in.";
            } else {
              mp.syncNotice = "⚠️ Your last score didn't save online — try signing in again.";
            }
          });
      } else {
        mp.syncNotice = "⚠️ Couldn't reach the leaderboard to save your score (you're still saved locally).";
      }
    }
  }
  showMenu(menuCoopResults());
}

function menuCoopResults() {
  const players = mp.isCoopHost ? Array.from(coop.players.values()) : (coop.lastSnapshot ? coop.lastSnapshot.players : []);
  const rows = players.map(p => {
    const dist = Math.max(0, Math.floor(((p.maxX || 100) - 100) / TILE));
    const cause = p.eliminated === "wall" ? "🌊 Caught by the wall"
                : p.eliminated === "hearts" ? "💔 Out of hearts" : "🏁 Still going";
    return `
    <div class="stats">
      <div class="stat">👤<b>${escapeHtml(p.nickname || "?")}</b>${p.id === mp.playerId ? "you" : "player"}</div>
      <div class="stat">📏<b>${dist} m</b>distance</div>
      <div class="stat money">🪙<b>${p.money || 0}</b>coins</div>
      <div class="stat">${cause}</div>
    </div>`;
  }).join("");

  return `<h2>🏁 Run Complete!</h2>
    ${rows}
    <div class="btns"><button class="primary" data-act="mpLeaveCoop">🚪 Back to Lobby</button></div>`;
}

function updateCoopHost(dt) {
  pollInput();
  const me = coop.players.get(mp.playerId);
  if (me) {
    me.input.left = input.left; me.input.right = input.right; me.input.jumpHeld = input.jumpHeld;
    if (input.jumpPressed) { me.jumpSeq++; input.jumpPressed = false; }
  }
  for (const p of coop.players.values()) if (p.alive) stepPlayerEntity(p, dt);
  updateCoopWorld(dt);

  let maxX = 100, maxAliveX = 100, anyAlive = false;
  for (const p of coop.players.values()) {
    if (p.x > maxX) maxX = p.x;
    if (p.alive) { anyAlive = true; if (p.x > maxAliveX) maxAliveX = p.x; }
  }
  while ((maxX + 3 * CHUNK_W) > (world.built + 1) * CHUNK_W) buildChunkAndBroadcast(world.built + 1);

  /* ---- the squish wall: one shared entity, same solo curve, paced by
     whoever's furthest ahead and still alive ---- */
  if (anyAlive) {
    coop.wall.maxX = Math.max(coop.wall.maxX, maxAliveX);
    coop.wall.dist = Math.max(0, Math.floor((coop.wall.maxX - 100) / TILE));
    const ws = Math.min(WALL_MAX, WALL_BASE + coop.wall.dist * WALL_GAIN);
    coop.wall.x += ws * dt;
    const lead = maxAliveX - coop.wall.x;
    if (lead > WALL_LEASH) coop.wall.x += (lead - WALL_LEASH) * 1.7 * dt;
    for (const p of coop.players.values()) {
      if (p.alive && coop.wall.x + 30 > p.x + 8) eliminatePlayerCoop(p, "wall");
    }
  }

  /* ---- run over: everyone eliminated. Same dramatic beat as solo's
     `run.over && run.endT > 1.1` before showGameOver(). ---- */
  if (!anyAlive && !coop.over) { coop.over = true; coop.overT = 0; }
  if (coop.over) {
    coop.overT += dt;
    if (coop.overT > 1.1 && !coop.resultsShown) { coop.resultsShown = true; coopShowResults(); }
  }

  coop.tick++;
  const now = performance.now();
  if (now - coop.lastSnapshotT >= 1000 / 15) {
    coop.lastSnapshotT = now;
    MP.broadcastCoopSnapshot(mp.sessionId, {
      tick: coop.tick,
      wall: { x: coop.wall.x, dist: coop.wall.dist },
      over: coop.over,
      players: Array.from(coop.players.values()).map(p => ({
        id: p.id, nickname: p.nickname, x: p.x, y: p.y, vx: p.vx, vy: p.vy, face: p.face,
        onGround: p.onGround, slide: p.slide, squash: p.squash, maxX: p.maxX,
        star: p.star > 0, hearts: p.hearts, alive: p.alive, eliminated: p.eliminated, money: p.money,
      })),
      coinsGot: coop.gotCoins, pickupsGot: coop.gotPickups,
      enemies: world.enemies.map(e => ({ id: e._id, x: e.x, y: e.y, dead: e.dead })),
    });
    coop.gotCoins = []; coop.gotPickups = [];
  }
}

/* ---- Stage 2: shared world simulation, host-only. Ported from updatePlay's
   enemy/coin/hazard/mover/pickup/ring blocks, looping over every alive
   PlayerEntity instead of the singular `player`. Coins/bricks are credited
   to whoever actually touched them (agreed with the user: individual
   credit, not a shared pot). The magical carrot's rainbow-ride minigame
   isn't supported here yet -- it just pays out a coin bonus instead. ---- */
function updateCoopWorld(dt) {
  for (const e of world.enemies) {
    if (e.dead) { e.dead += dt; continue; }
    e.t += dt;
    if (e.kind === "7") {
      e.hopT -= dt;
      if (e.onGround && e.hopT <= 0) { e.vy = -600; e.hopT = 1.1 + Math.random() * 0.6; e.onGround = false; }
    }
    const before = e.vx;
    const r = moveBody(e, dt);
    e.onGround = r.ground;
    if (r.wall) e.vx = -before;
    if (r.ground) {
      const ahead = e.x + (e.vx > 0 ? e.w + 4 : -4);
      if (!isSolidPx(ahead, e.y + e.h + 6)) e.vx = -e.vx;
    }
    if (e.vx === 0) e.vx = (Math.random() < 0.5 ? -1 : 1) * 55;

    for (const p of coop.players.values()) {
      if (!p.alive || !overlap(p, e)) continue;
      const fell = p.vy > 60 && (p.prevY + p.h) <= e.y + 14;
      if (p.star > 0 && !fell) {
        e.dead = 0.001; e.vx = 0;
        p.stomps++; p.money += 5; game.shake = 5;
        floatText(e.x + e.w/2, e.y, "+5", "#ffe97a");
        burst(e.x + e.w/2, e.y + e.h/2, "#ffe97a", 14);
      } else if (fell) {
        e.dead = 0.001; e.vx = 0;
        p.combo++;
        const pay = 5 * p.combo;
        p.vy = -STOMP_BOUNCE - Math.min(120, p.combo * 22);
        p.squash = -0.4; p.airJumps = 1;
        p.stomps++; p.money += pay; game.shake = 6;
        floatText(e.x + e.w/2, e.y, p.combo > 1 ? "+" + pay + "  x" + p.combo + "!" : "+" + pay,
                  p.combo > 1 ? "#ff7fb0" : "#fff");
        burst(e.x + e.w/2, e.y + e.h/2, e.kind === "6" ? "#ffc7de" : "#c9d8ff", 8 + p.combo * 4);
      } else hurtP(p);
      break;   // first-alive-match-wins, avoids double-payout in the same tick
    }
  }
  for (let i = world.enemies.length - 1; i >= 0; i--) {
    if (world.enemies[i].dead && world.enemies[i].dead > 0.45) world.enemies.splice(i, 1);
  }

  for (const c of world.coins) {
    if (c.got) continue;
    c.t += dt;
    for (const p of coop.players.values()) {
      if (!p.alive) continue;
      const dx = (p.x + p.w/2) - c.x, dy = (p.y + p.h/2) - c.y;
      if (dx*dx + dy*dy < 30*30) {
        c.got = true; p.coins++; p.money++; S.coin();
        burst(c.x, c.y, "#ffe07a", 7, 150);
        coop.gotCoins.push(c._id);
        break;
      }
    }
  }

  for (const hz of world.hazards) {
    hz.t += dt;
    for (const p of coop.players.values()) {
      if (!p.alive || p.star > 0) continue;
      if (p.x + p.w - 5 > hz.x - 15 && p.x + 5 < hz.x + 15 && p.y + p.h > hz.y - 14 && p.y < hz.y + 17) hurtP(p);
    }
  }

  // bricks (X) and planks (=) -- interactive on the host; a guest sees the
  // tile itself change via the "tile" broadcast, see bumpBrickFor/below
  for (const m of world.movers) {
    if (m.kind === "X") {
      if (m.shake > 0) m.shake = Math.max(0, m.shake - dt);
    } else if (m.kind === "P") {
      if (m.state === "solid") {
        const top = m.y - TILE/2;
        let standing = false;
        for (const p of coop.players.values()) {
          if (p.alive && p.onGround && p.x + p.w > m.x - TILE/2 + 2 && p.x < m.x + TILE/2 - 2 &&
              Math.abs((p.y + p.h) - top) < 7) standing = true;
        }
        if (standing) { m.state = "shake"; m.timer = WOOD_SHAKE; S.creak(); }
      } else if (m.state === "shake") {
        m.timer -= dt;
        if (m.timer <= 0) {
          setTile(m.ci, m.row, m.col, ".");
          MP.broadcastCoopTile(mp.sessionId, { index: m.ci, row: m.row, col: m.col, ch: "." });
          m.state = "fall"; m.timer = WOOD_BACK; m.fy = 0; m.vy = 0;
          burst(m.x, m.y, "#c9a06a", 12, 170);
        }
      } else {
        m.timer -= dt; m.vy += 1500 * dt; m.fy += m.vy * dt;
        if (m.timer <= 0) {
          setTile(m.ci, m.row, m.col, "=");
          MP.broadcastCoopTile(mp.sessionId, { index: m.ci, row: m.row, col: m.col, ch: "=" });
          m.state = "solid"; m.fy = 0; m.vy = 0;
        }
      }
    }
    // droppers/rolling cheese/bouncing berries/trampoline (F/W/Z/T) are not
    // simulated in the shared arena yet -- host-only follow-up
  }

  for (const pk of world.pickups) {
    if (pk.got) continue;
    pk.t += dt;
    for (const p of coop.players.values()) {
      if (!p.alive) continue;
      const dx = (p.x + p.w/2) - pk.x, dy = (p.y + p.h/2) - pk.y;
      if (dx*dx + dy*dy < 34*34) {
        pk.got = true;
        if (pk.kind === "carrot") { p.money += 20; floatText(pk.x, pk.y - 20, "+20", "#ffd36b"); }
        else grabStarFor(p, pk.x, pk.y);
        coop.gotPickups.push(pk._id);
        break;
      }
    }
  }

  for (const rg of world.rings) {
    rg.a += dt * 2.2; rg.y = rg.base + Math.sin(rg.a * 0.8) * 34;
    for (const p of coop.players.values()) {
      if (!p.alive || p.star > 0) continue;
      const dx = (p.x + p.w/2) - rg.x, dy = (p.y + p.h/2) - rg.y;
      if (dx*dx + dy*dy < 30*30) hurtP(p);
    }
  }
}

function updateCoopGuest(dt) {
  pollInput();
  if (input.jumpPressed) { coop.myJumpSeq++; input.jumpPressed = false; }
  const cur = { left: input.left, right: input.right, jumpHeld: input.jumpHeld };
  const changed = !coop.lastSentInput ||
    cur.left !== coop.lastSentInput.left || cur.right !== coop.lastSentInput.right || cur.jumpHeld !== coop.lastSentInput.jumpHeld;
  const now = performance.now();
  if (changed || now - coop.lastInputSentT > 100) {
    coop.lastInputSentT = now; coop.lastSentInput = cur;
    MP.broadcastCoopInput(mp.sessionId, { playerId: mp.playerId, ...cur, jumpSeq: coop.myJumpSeq });
  }
}

function renderCoop(t, dt) {
  const players = mp.isCoopHost
    ? Array.from(coop.players.values())
    : (coop.lastSnapshot ? coop.lastSnapshot.players : []);
  const me = players.find(p => p.id === mp.playerId);
  if (!me) { drawSky(coop.camX, t); return; }

  const targetCamX = Math.max(me.x - 340, -460);
  coop.camX += (targetCamX - coop.camX) * Math.min(1, dt * 6);
  const camX = coop.camX;

  ctx.save();
  drawSky(camX, t);
  drawTiles(camX);
  for (const hz of world.hazards) if (hz.x > camX - 60 && hz.x < camX + W + 60) drawHazard(hz, camX, t);
  drawCoins(camX, t);
  for (const rg of world.rings) if (rg.x > camX - 60 && rg.x < camX + W + 60) drawRing(rg, camX);
  for (const m of world.movers) if (m.x > camX - 80 && m.x < camX + W + 80) drawMover(m, camX, t);
  for (const pk of world.pickups) {
    if (pk.got || pk.x < camX - 90 || pk.x > camX + W + 90) continue;
    pk.kind === "star" ? drawStar(pk, camX, t) : drawCarrot(pk, camX, t);
  }
  for (const e of world.enemies) if (e.x > camX - 80 && e.x < camX + W + 80) drawEnemy(e, camX, t);
  for (const p of players) {
    if (p.alive === false) continue;
    // guests don't receive `anim` (host's real one) over the wire -- it's
    // just a run-cycle phase, so re-derive it locally the same way solo
    // play accumulates it (index.html ~1240), keyed per remote player id
    let anim = p.anim;
    if (!mp.isCoopHost) {
      anim = (coop.remoteAnim.get(p.id) || 0) + dt * (p.onGround ? Math.abs(p.vx) / 42 : 4);
      coop.remoteAnim.set(p.id, anim);
    }
    if (p.star) {
      ctx.save(); ctx.globalAlpha = 0.85;
      ctx.strokeStyle = RAINBOW_COLS[Math.floor(t * 14) % RAINBOW_COLS.length];
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.ellipse(p.x + p.w/2 - camX, p.y + p.h/2 - 3, 25, 26, 0, 0, 7); ctx.stroke();
      ctx.restore();
    }
    drawDumplingHero(p.x + p.w/2 - camX, p.y + p.h, 1, t, {
      run: anim, air: p.onGround ? 0 : 1,
      squash: p.squash || 0, face: p.face || 1, slide: !!p.slide,
      palette: CLASSIC_PALETTE, accessory: null,
    });
  }
  drawParticles(camX);
  ctx.font = "900 20px ui-rounded,system-ui,sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const tx of world.texts) {
    ctx.globalAlpha = Math.max(0, 1 - tx.life / tx.max);
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(90,74,102,.55)";
    ctx.strokeText(tx.txt, tx.x - camX, tx.y);
    ctx.fillStyle = tx.color; ctx.fillText(tx.txt, tx.x - camX, tx.y);
  }
  ctx.globalAlpha = 1;
  drawWallCoop(camX, t);
  if (me.alive !== false) drawWallWarningCoop(camX, t, me.x);
  ctx.restore();
}

/* wall drawing, parameterized off coop.wall.x instead of the solo run.wallX
   global -- otherwise identical to drawWall/drawWallWarning */
function drawWallCoop(camX, t) {
  const edge = coop.wall.x - camX;
  if (edge < -60) return;
  const g = ctx.createLinearGradient(-40, 0, edge, 0);
  g.addColorStop(0, "#c2508f"); g.addColorStop(0.6, "#ef82b6"); g.addColorStop(1, "#ffb3d4");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(-60, -20); ctx.lineTo(-60, H + 20);
  for (let y = H + 20; y >= -20; y -= 14) {
    ctx.lineTo(edge + Math.sin(y * 0.035 + t * 3.4) * 9 + Math.sin(y * 0.09 - t * 2) * 4, y);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.35)";
  for (let i = 0; i < 12; i++) {
    const yy = mod(i * 61 - t * 46, H + 60) - 30;
    const xx = edge - 26 - Math.sin(yy * 0.05 + t) * 16;
    ctx.beginPath(); ctx.arc(xx, yy, 3 + (i % 3), 0, 7); ctx.fill();
  }
}

function drawWallWarningCoop(camX, t, myX) {
  const gap = myX - coop.wall.x;
  if (gap > 300) return;
  const heat = Math.min(1, (300 - gap) / 260) * (0.55 + 0.45 * Math.sin(t * 11));
  const g = ctx.createLinearGradient(0, 0, W * 0.55, 0);
  g.addColorStop(0, "rgba(255,80,150," + (0.5 * heat).toFixed(3) + ")");
  g.addColorStop(1, "rgba(255,80,150,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W * 0.55, H);
}

function mpOnTradeRow(row) {
  if (!mp.trade || mp.trade.id !== row.id) return;
  const iAmA = row.player_a === mp.playerId;
  mp.trade.offerMine = iAmA ? row.offer_a : row.offer_b;
  mp.trade.offerTheirs = iAmA ? row.offer_b : row.offer_a;
  mp.trade.confirmedMine = iAmA ? row.confirmed_a : row.confirmed_b;
  mp.trade.confirmedTheirs = iAmA ? row.confirmed_b : row.confirmed_a;
  mp.trade.status = row.status;

  if (row.status === "completed") { mpHandleTradeCompleted(); return; }
  if (row.status !== "negotiating") {
    if (mp.unwatchTrade) { mp.unwatchTrade(); mp.unwatchTrade = null; }
    mp.trade = null; mp.myOffer = [];
    mp.notice = "The trade ended.";
    showMenu(menuLobby());
    return;
  }
  showMenu(menuTradeSession());
}

async function mpHandleTradeCompleted() {
  try { save.counts = await MP.pullInventory(); persist(); } catch (e) { /* keep local counts if this fails */ }
  if (mp.unwatchTrade) { mp.unwatchTrade(); mp.unwatchTrade = null; }
  MP.broadcastTradeEvent(mp.sessionId, "trade_completed", {});
  mp.trade = null; mp.myOffer = [];
  mp.notice = "🎉 Trade complete!";
  showMenu(menuLobby());
}
