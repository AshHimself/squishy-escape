function menuBook() {
  const cells = SQUISHIES.map(s => {
    const n = save.counts[s.id] || 0;
    const eq = save.equipped === s.id;
    const power = s.power ? `<div class="pw">${POWER_ICON[s.power]} ${n ? s.powerName : "?"}</div>` : "";
    return `<div class="cell ${n ? "have" : "locked"} ${eq ? "equipped" : ""}" data-act="${n ? "equip" : ""}" data-id="${s.id}">
      ${n ? `<canvas data-sq="${s.id}" data-size="54"></canvas>` : `<div style="width:54px;height:54px;display:grid;place-items:center;font-size:28px;font-weight:900;opacity:.22">?</div>`}
      <div class="nm">${n ? s.name : "???"}</div>
      <div class="rr" style="color:${RARITY_INK[s.r]}">${RARITY[s.r]}</div>
      ${power}
      ${n > 1 ? `<div class="ct">x${n}</div>` : ""}
    </div>`;
  }).join("");
  return `<h2>Collection</h2>
    <p class="sub">${distinctOwned()} of ${SQUISHIES.length} found — tap one you own to carry it with you<br>
    ✨ Mythic squishies grant a superpower while equipped — only one at a time</p>
    <div class="grid">${cells}</div>
    <div class="btns"><button data-act="hub">Back</button></div>`;
}

function menuTrader() {
  let rows = "";
  const topTier = RARITY.length - 1;
  for (let t = 0; t < topTier; t++) {
    const d = dupesOfRarity(t);
    rows += `<div class="tradeRow">
      <span>3 spare <b style="color:${RARITY_INK[t]}">${RARITY[t]}</b> → 1 random <b style="color:${RARITY_INK[t+1]}">${RARITY[t+1]}</b><br>
      <span style="opacity:.6;font-weight:700">you have ${d} spare</span></span>
      <button class="small" data-act="trade" data-t="${t}" ${d < 3 ? "disabled" : ""}>Trade</button></div>`;
  }
  const dTop = dupesOfRarity(topTier);
  rows += `<div class="tradeRow">
    <span>3 spare <b style="color:${RARITY_INK[topTier]}">${RARITY[topTier]}</b> → 800 🪙<br>
    <span style="opacity:.6;font-weight:700">you have ${dTop} spare</span></span>
    <button class="small" data-act="trade" data-t="${topTier}" ${dTop < 3 ? "disabled" : ""}>Trade</button></div>`;
  const odds = eggDef().odds;
  return `<h2>🤝 Squishy Trader</h2>
    <p class="sub">"Spare squishies? I'll trade you up, friend."</p>
    ${rows}
    <p class="sub" style="margin-top:1em">Your ${eggDef().name} hatches:</p>
    <div class="odds">${RARITY.map((r, i) => `<span style="color:${RARITY_INK[i]}">${r} ${odds[i]}%</span>`).join("")}</div>
    <div class="btns"><button data-act="hub">Back</button></div>`;
}

function menuReveal(sq, free) {
  return `<h2 style="color:${RARITY_INK[sq.r]}">${RARITY[sq.r]}!</h2>
    <div style="display:grid;place-items:center;margin:.2em 0 .4em">
      <canvas data-sq="${sq.id}" data-size="120"></canvas></div>
    <h2 style="margin:0">${sq.name}</h2>
    <p class="sub">${(save.counts[sq.id] || 0) > 1
      ? `You already had one — spare copies can be traded up.`
      : `New! Added to your collection.`}</p>
    <div class="btns">
      ${free ? `<button class="primary" data-act="start">▶ Start your first run</button>` : ""}
      <button data-act="hub">${free ? "Look around first" : "Nice!"}</button>
      ${!free && money() >= HATCH_COST ? `<button data-act="hatch">🥚 Hatch another <span class="cost">${HATCH_COST}</span></button>` : ""}
    </div>`;
}

function menuPause() {
  return `<h2>Paused</h2>
    <div class="stats">
      <div class="stat">📏<b>${run.dist} m</b>so far</div>
      <div class="stat money">🪙<b>${run.money}</b>this run</div>
    </div>
    <div class="btns">
      <button class="primary" data-act="resume">▶ Keep running</button>
      <button data-act="giveup">🏳️ Give up</button>
    </div>`;
}

function togglePause() {
  if (game.state === "play") {
    if (run.over) return;
    game.state = "paused"; MUSIC.setMode("off");
    document.getElementById("touch").classList.remove("on");
    showMenu(menuPause());
  } else if (game.state === "paused") {
    game.state = "play"; MUSIC.setMode("run");
    document.getElementById("touch").classList.add("on");
    showMenu(null);
  }
}

function menuGameOver() {
  const cause = run.cause === "wall"
    ? "The squish wall got you!" : "You ran out of hearts!";
  return `<h2>${cause}</h2>
    <p class="sub">Run #${save.runs}</p>
    <div class="stats">
      <div class="stat">📏<b>${run.dist} m</b>distance</div>
      <div class="stat">🪙<b>${run.coins}</b>coins</div>
      <div class="stat">👟<b>${run.stomps}</b>6-7s squashed</div>
      <div class="stat money">💰<b>+${run.money}</b>Dumpleningness</div>
    </div>
    <p class="sub">(includes a +${run.bonus} distance bonus) — you now have <b>${money()}</b> 🪙${
      run.dist >= save.bestDist && run.dist > 0 ? `<br>🎉 New best distance!` : ""}</p>
    ${run.dist >= save.bestDist && run.dist > 0 && !save.cloudPlayerId && window.MP && MP.available()
      ? `<p class="sub" style="font-weight:800">🏆 Sign up in Trade Online to put this run on the leaderboard!</p>` : ""}
    <div class="btns">
      <button class="primary" data-act="start">↻ Run Again</button>
      <button data-act="hub">🏠 Hub</button>
      ${money() >= HATCH_COST ? `<button data-act="hatch">🥚 Hatch <span class="cost">${HATCH_COST}</span></button>` : ""}
    </div>`;
}

function showGameOver() {
  if (game.state !== "play" && game.state !== "paused") return;
  game.state = "over";
  setPlayUI(false);
  showMenu(menuGameOver());
}

function activateGodMode() {
  audioOn();
  save.eggTier = EGGS.length;
  persist();
  S.godMode();
  game.shake = 14;
  showMenu(`
    <div style="background:radial-gradient(ellipse at 50% 30%,#3a1206,#1a0a06);
      margin:0;padding:clamp(36px,8vmin,80px) clamp(14px,2.6vmin,28px);border-radius:16px">
      <h1 style="background:linear-gradient(90deg,#ff4400,#ffae00,#ff4400);-webkit-background-clip:text;background-clip:text;color:transparent;
        font-size:clamp(22px,5.6vmin,52px);text-shadow:0 0 30px rgba(255,80,0,.6);letter-spacing:.04em;margin:0">
        GOD MODE ACTIVATED
      </h1>
      <p style="color:#ffb066;font-weight:800;margin:.8em 0 0;font-size:clamp(11px,2vmin,17px)">
        idfka — every egg tier unlocked. Go hatch something horrifying and cute.
      </p>
    </div>`);
  setTimeout(() => { if (game.state === "hub") goHub(); }, 1900);
}

function goHub() {
  game.state = "hub";
  MUSIC.setMode("hub");
  setPlayUI(false);
  showMenu(menuHub());
}

function beginHatch(free) {
  audioOn();
  if (!free) {
    if (save.money < HATCH_COST) return;
    save.money -= HATCH_COST; persist();
  }
  game.state = "hatch";
  MUSIC.setMode("hub");
  world.parts.length = 0;
  game.hatch = { t: 0, sq: free ? pickOfRarity(0) : rollSquishy(), tier: free ? 1 : save.eggTier, revealed: false, free };
  showMenu(null);
}

/* menu clicks */
sheetEl.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (!act) return;
  audioOn(); S.click();
  switch (act) {
    case "start":   startRun(); break;
    case "resume":  togglePause(); break;
    case "giveup":  game.state = "play"; endRun("hearts"); showGameOver(); break;
    case "hub":     goHub(); break;
    case "help":    showMenu(menuHelp()); break;
    case "book":    showMenu(menuBook()); break;
    case "skins":   showMenu(menuSkins()); break;
    case "trader":  showMenu(menuTrader()); break;
    case "hatch":   beginHatch(false); break;
    case "upgrade": {
      const cost = eggDef().upgrade;
      if (cost && save.money >= cost) {
        save.money -= cost; save.eggTier++; persist();
        S.hatch();
      }
      showMenu(menuHub()); break;
    }
    case "equip": {
      const id = el.dataset.id;
      if (owned(id)) { save.equipped = save.equipped === id ? null : id; persist(); }
      showMenu(menuBook()); break;
    }
    case "equipSkin": {
      const id = el.dataset.id;
      const ok = PALETTES.some(p => p.id === id) || (byId(id) && owned(id));
      if (ok) { save.skin = save.skin === id ? "classic" : id; persist(); }
      showMenu(menuSkins()); break;
    }
    case "equipAcc": {
      const acc = ACCESSORIES.find(a => a.id === el.dataset.id);
      if (acc && accessoryUnlocked(acc)) {
        save.accessory = save.accessory === acc.id ? null : acc.id; persist();
      }
      showMenu(menuSkins()); break;
    }
    case "trade": {
      const t = +el.dataset.t;
      if (dupesOfRarity(t) < 3) break;
      let need = 3;
      for (const s of SQUISHIES) {
        if (s.r !== t || need === 0) continue;
        const spare = Math.max(0, (save.counts[s.id] || 0) - 1);
        const take = Math.min(spare, need);
        save.counts[s.id] -= take; need -= take;
      }
      if (t === RARITY.length - 1) { save.money += 800; persist(); showMenu(menuTrader()); S.coin(); }
      else {
        persist();
        game.state = "hatch";
        world.parts.length = 0;
        game.hatch = { t: 1.6, sq: pickOfRarity(t + 1), tier: save.eggTier, revealed: false, free: false };
        showMenu(null);
      }
      break;
    }
    case "multiplayer":  mpOpenEntry(); break;
    case "leaderboard":  openLeaderboard(); break;
    case "mpAuthMode":   mp.authMode = el.dataset.id; mp.error = null; showMenu(menuRegister()); break;
    case "mpAuthSubmit": mpAuthSubmit(); break;
    case "mpLogout":
      mp.playerId = null; mp.nickname = null; save.cloudPlayerId = null; save.cloudNickname = null; persist();
      mp.authMode = "login"; mp.error = null;
      showMenu(menuRegister());
      break;
    case "mpCreateRoom": mpEnterRoom(() => MP.createRoom()); break;
    case "mpJoinRoom": {
      const code = (document.getElementById("mpCode").value || "").trim();
      if (!code) break;
      mpEnterRoom(() => MP.joinRoom(code));
      break;
    }
    case "mpLeaveRoom": {
      const sid = mp.sessionId;
      if (mp.unwatchRoom) { mp.unwatchRoom(); mp.unwatchRoom = null; }
      mp.sessionId = null; mp.code = null; mp.roster = []; mp.trade = null; mp.myOffer = []; mp.notice = null;
      showMenu(menuLobby());
      if (sid) MP.leaveRoom(sid).catch(() => {});
      break;
    }
    case "mpStartCoop": mpStartCoopHost(); break;
    case "mpLeaveCoop": leaveCoop(); break;
    case "mpTradeWith": {
      const otherPlayerId = el.dataset.id;
      const other = mp.roster.find(p => p.playerId === otherPlayerId);
      mp.busy = true; mp.error = null;
      MP.proposeTrade(mp.sessionId, otherPlayerId, [])
        .then(tradeId => {
          mp.busy = false;
          mp.trade = { id: tradeId, otherPlayerId, otherNickname: other ? other.nickname : "them",
                        offerMine: [], offerTheirs: [], confirmedMine: false, confirmedTheirs: false, status: "negotiating" };
          mp.myOffer = [];
          mp.unwatchTrade = MP.watchTrade(tradeId, mpOnTradeRow);
          MP.broadcastTradeEvent(mp.sessionId, "trade_started", {
            tradeId, toPlayerId: otherPlayerId, fromPlayerId: mp.playerId, fromNickname: mp.nickname,
          });
          showMenu(menuTradeSession());
        })
        .catch(err => { mp.busy = false; mp.error = err.message || "Something went wrong."; showMenu(menuLobby()); });
      break;
    }
    case "mpToggleOffer": {
      const id = el.dataset.id;
      const i = mp.myOffer.indexOf(id);
      if (i === -1) mp.myOffer.push(id); else mp.myOffer.splice(i, 1);
      showMenu(menuTradeSession());
      break;
    }
    case "mpSendOffer": {
      if (!mp.trade) break;
      const items = mp.myOffer.map(id => ({ squishy_id: id, qty: 1 }));
      mp.trade.offerMine = items; mp.trade.confirmedMine = false; mp.trade.confirmedTheirs = false;
      showMenu(menuTradeSession());
      MP.updateTradeOffer(mp.trade.id, items).catch(err => { mp.error = err.message || "Something went wrong."; showMenu(menuTradeSession()); });
      break;
    }
    case "mpConfirmTrade": {
      if (!mp.trade) break;
      mp.busy = true; mp.error = null;
      MP.confirmTrade(mp.trade.id)
        .then(() => { mp.busy = false; showMenu(menuTradeSession()); })
        .catch(err => { mp.busy = false; mp.error = err.message || "Something went wrong."; showMenu(menuTradeSession()); });
      break;
    }
    case "mpCancelTrade": {
      if (!mp.trade) break;
      const tradeId = mp.trade.id;
      if (mp.unwatchTrade) { mp.unwatchTrade(); mp.unwatchTrade = null; }
      mp.trade = null; mp.myOffer = [];
      showMenu(menuLobby());
      MP.cancelTrade(tradeId).catch(() => {});
      break;
    }
  }
});

/* mute */
const muteBtn = document.getElementById("btnMute");
function toggleMute() {
  save.muted = !save.muted; persist();
  muteBtn.textContent = save.muted ? "🔇" : "🔊";
  MUSIC.gain();
}
muteBtn.textContent = save.muted ? "🔇" : "🔊";
muteBtn.addEventListener("click", () => { audioOn(); toggleMute(); });
const pauseBtn = document.getElementById("btnPause");
pauseBtn.addEventListener("click", () => {
  audioOn(); S.click();
  if (game.state === "coop") leaveCoop(); else togglePause();
});

/* ==========================================================================
   MAIN LOOP
   ========================================================================== */
let last = performance.now(), acc = 0;
const STEP = 1 / 120;
function frame(now) {
  let dt = Math.min(0.25, (now - last) / 1000); last = now;
  game.t += dt;
  if (game.state === "play" || game.state === "over") {
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard++ < 40) { updatePlay(STEP); acc -= STEP; }
    renderPlay(game.t);
  } else if (game.state === "paused") {
    acc = 0;
    renderPlay(game.t);
  } else if (game.state === "coop") {
    if (mp.isCoopHost) {
      acc += dt;
      let guard = 0;
      while (acc >= STEP && guard++ < 40) { updateCoopHost(STEP); acc -= STEP; }
    } else {
      acc = 0;
      updateCoopGuest(dt);
    }
    renderCoop(game.t, dt);
  } else if (game.state === "hatch") {
    renderHatch(game.t, dt);
  } else {
    renderHub(game.t);
  }
  requestAnimationFrame(frame);
}

/* poke at the game from the browser console: __SE.save, __SE.player, etc. */
window.__SE = { game, save, player, run, world, startRun, goHub, beginHatch, persist, MUSIC, SECTIONS,
                rainbowY, startRainbow, endRainbow, buildChunk, resetWorld, grabStar, VERSION,
                tileAtPx, isSolidPx, bumpBrick, equippedPower,
                PALETTES, ACCESSORIES, currentPalette, squishyPalette, accessoryUnlocked,
                SQUISHIES, EGGS, TEMPLATES, grant, input, reset(){ localStorage.removeItem(SAVE_KEY); location.reload(); },
                mp, coop, mpStartCoopHost, mpStartCoopGuest, leaveCoop, updateCoopHost, updateCoopGuest, renderCoop,
                updateCoopWorld, hurtP, grabStarFor, bumpBrickFor, eliminatePlayerCoop, stepPlayerEntity, makePlayerEntity };

/* first boot: the common egg from the spec, free, hatching on its own */
resetWorld();
if (!save.seenIntro) {
  save.seenIntro = true; persist();
  showMenu(`<h1>Squishy Escape</h1>
    <p class="sub">by Annie Smith &amp; Ash Smith</p>
    <div style="font-size:clamp(12px,2.1vmin,18px);font-weight:700;line-height:1.55;margin:.4em 0 1em">
      There's an egg here. A <b>Common Egg</b>.<br>
      Inside is your very first squishy.<br><br>
      Hatch it, run the obstacle course, squash the 6-7s,<br>
      outrun the squish wall, and bring home the
      <b>Dumpleningness</b>.<br><br>
      Then buy a better egg. Then a better one.
    </div>
    <div class="btns"><button class="primary" data-act="firsthatch">🥚 Crack it open</button></div>`);
  sheetEl.addEventListener("click", e => {
    const el = e.target.closest('[data-act="firsthatch"]');
    if (el) { audioOn(); beginHatch(true); }
  });
} else {
  goHub();
}
requestAnimationFrame(frame);
})();
</script>
